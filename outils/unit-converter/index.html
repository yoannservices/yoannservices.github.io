<!DOCTYPE html>
<html lang="fr" data-cat="outils">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertisseur d'Unités</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/theme.css" />
  <script src="../../assets/site.js" defer></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1><i class="fas fa-arrows-rotate"></i> Convertisseur <span class="accent">d'Unités</span></h1>
    <p class="subtitle">Conversions instantanées dans 9 catégories · Devises en temps réel</p>
  </header>

  <main>
    <nav class="cat-bar" id="cat-bar"></nav>

    <div class="converter-card">
      <div class="input-row">
        <div class="field">
          <label>Valeur</label>
          <input type="number" id="input-val" value="1" />
        </div>
        <div class="field">
          <label>De</label>
          <select id="unit-from"></select>
        </div>
        <button class="swap-btn" id="btn-swap" title="Inverser"><i class="fas fa-right-left"></i></button>
        <div class="field">
          <label>Vers</label>
          <select id="unit-to"></select>
        </div>
      </div>

      <div class="result-box" id="result-box">
        <span class="result-value" id="result-value"> - </span>
        <span class="result-label" id="result-label"></span>
      </div>

      <div class="all-conversions" id="all-conversions"></div>
    </div>

    <div class="history-panel">
      <div class="history-header">
        <h3><i class="fas fa-clock-rotate-left"></i> Historique</h3>
        <button class="btn-clear" id="btn-clear-history">Effacer</button>
      </div>
      <div class="history-list" id="history-list">
        <p class="empty">Aucune conversion enregistrée</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
