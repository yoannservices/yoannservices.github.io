  "À chaque foulée, la rage montait d'un cran, alimentée par ma propre imagination qui galopait plus vite encore que mes jambes. Je l'imaginais à terre. Je l'imaginais en sang. Cette chose froide et brûlante à la fois prenait toute la place, chassant la fatigue, la raison, jusqu'au souvenir même de qui j'étais en temps normal.",
  "J'ai mis trente minutes pour un trajet qui en prend habituellement soixante par les transports. Je ne l'ai su qu'après, en regardant l'heure, incapable de comprendre comment mon corps avait pu tenir un tel rythme sans jamais faiblir, comme actionné par quelque chose qui n'était plus tout à fait moi."]});
shot({bg:'hall',tint:['#032439',.3,4],cast:{d:P('dylan',700,{expr:'fear',bruise:1,cls:'cower'}),y:P('yoann',340,{expr:'neutral',enter:'L',delay:.2})},ghost:[['y',4]],
 beats:["Je l'ai vu de loin, assis sur les marches devant son immeuble, recroquevillé, une main plaquée contre son visage. Les derniers mètres, je les ai parcourus au ralenti dans ma tête alors que mon corps continuait de courir à pleine vitesse — cette sensation étrange de dédoublement.",
  "Il s'est levé en m'entendant arriver, et c'est là que je l'ai vu vraiment, sous la lumière blafarde du hall. Une marque violacée s'étendait déjà tout autour de son œil, la peau tendue et luisante. Sa lèvre était fendue à un coin, un mince filet de sang séché à la commissure. Il a soulevé son tee-shirt déchiré à l'épaule, comme s'il avait besoin que je voie : plusieurs traces sombres zébraient son dos, certaines déjà bleu profond, comme si on l'avait frappé alors qu'il essayait de se recroqueviller contre un mur.",
  "Je n'ai rien dit. Quelque chose en moi s'est éteint et s'est allumé en même temps, dans le même souffle — plus de bruit dans ma tête, juste ce silence total, cette froideur qui avait déjà pris toute la place avant même que j'aie pu la voir venir.",
  "Dylan a dû le sentir. Il a reculé d'un demi-pas, presque imperceptiblement, et j'ai vu sur son visage tuméfié quelque chose se superposer à la douleur. De la peur. Une peur qui ne venait pas de son agression, cette fois, mais de moi.",
  ['d',"Yoann... Ton visage..."]]});
shot({bg:'hall',tint:['#032439',.3,0],cast:{d:P('dylan',640,{expr:'sad',bruise:1,anim:'hug'}),y:P('yoann',560,{expr:'cold',anim:'hug'})},ghost:[['y']],
 beats:["Je me suis approché doucement, comme on s'approcherait d'un animal blessé, et je l'ai pris contre moi, en évitant son dos, sentant son corps se raidir un instant avant de se laisser aller contre le mien.",
  ['y',"Tu les as reconnus ? T'as vu leurs visages ?"],['d',"Pas vraiment. Il faisait trop sombre. Ils avaient des capuches."],
  ['d',"Yoann, s'il te plaît. Je vois ce qui est en train de se passer dans ta tête. J'ai besoin que tu restes avec moi, là. J'ai besoin que tu bouges pas."],
  ['y',"Et ta montre, elle avait quoi comme fonction, elle se géolocalise ?"],
  "Il a hésité, une fraction de seconde, cherchant dans mon regard quelque chose qui aurait pu ressembler à de la raison, à de la mesure. Il n'a rien trouvé. Il a fini par hocher la tête, résigné, et m'a donné son mot de passe sans plus rien ajouter.",
  ['d',"Yoann, tu m'écoutes ? Je veux pas que t'ailles là-bas. Je veux pas que tu voies ces gens. S'il te plaît. J'ai peur de ce que tu vas faire. J'ai peur de... j'ai peur de toi, là, maintenant."],
  "Les mots ont glissé sur moi sans vraiment s'arrêter, comme s'ils appartenaient à une conversation qui se déroulait loin derrière moi, dans une pièce que j'avais quittée depuis longtemps."]});
shot({bg:'hall',tint:['#032439',.3,0],cast:{y:P('yoann',420,{expr:'cold',phone:1}),d:P('dylan',900,{expr:'sad',bruise:1})},extra:(T)=>`<g class="txt" style="--d:${T[2].toFixed(1)}s">${phoneMap()}</g>`,
 beats:["J'ai appelé Johann, pour le prévenir.",
  ['y',"Dylan s'est fait agresser. Je suis chez lui, ça va, enfin ça va pas, mais il est pas amoché au point d'aller à l'hôpital. Je voulais juste que tu saches où j'étais, au cas où."],
  "« J'arrive », a-t-il juste dit, sans discuter, et j'ai entendu dans sa voix qu'il avait déjà compris ce que ce « au cas où » impliquait vraiment. La localisation de la montre a mis quelques secondes à s'afficher : un point clignotant sur la carte, à quinze minutes à pied, du côté de la cité qui borde le quartier de Dylan. Un point immobile depuis un moment — ils s'étaient arrêtés quelque part, sans se douter que l'objet volé continuait de parler en silence.",
  ['y',"Reste ici. Mets de la glace sur ton œil. Johann arrive."],
  ['d',"Yoann, non, s'il te plaît, pas encore une fois... Yoann, s'il te plaît, reviens !"],
  "Je n'ai pas ralenti. Le quartier a changé autour de moi, les pavillons cédant la place à des tours plus hautes, plus serrées, les lampadaires plus rares, plus jaunes, plus tremblants. Il n'y avait plus de mots dans ma tête, juste cette direction, ce point sur l'écran, cette certitude froide qui avançait à ma place."]});
shot({bg:'cour',tint:['#06223a',.2,0],
 cast:{a:P('thug',470,{s:.95,anim:'laugh',expr:'neutral'}),b:P('thug',580,{s:.95}),c:P('thug',700,{s:.95,anim:'laugh'}),t:P('thug',810,{s:.95,knife:1}),y:P('yoann',110,{anim:'walk',go:[1,260,3],expr:'cold'})},ghost:[['y',1]],
 beats:["Le point m'a mené jusqu'à une cour intérieure, coincée entre deux barres d'immeubles, éclairée par un unique lampadaire à moitié grillé qui clignotait, projetant des ombres qui semblaient respirer au même rythme que moi. Quatre silhouettes étaient assises sur un muret, en train de rire, l'une d'elles tripotant la montre de Dylan.",
  "Je me suis avancé sans un mot, et le silence qui a précédé leur remarque a suffi à faire taire leurs rires.",
  ['a',"C'est qui lui ?"],['y',"Vous avez pris un truc qui m'appartient pas. Vous allez me le rendre."],
  "Ils ont échangé un regard, amusés plus qu'inquiets. L'un d'eux, plus grand que les autres, a sorti un couteau de sa poche. La lame a accroché un instant la lumière du lampadaire. Il s'est avancé vers moi presque nonchalant, comme s'il s'agissait d'une formalité. Je n'ai pas reculé."]});
shot({bg:'cour',tint:['#000',.4,0,.5],
 cast:{a:P('thug',470,{s:.95,fallAt:1,pal:SILPAL}),b:P('thug',580,{s:.95,fallAt:2,pal:SILPAL}),c:P('thug',700,{s:.95,fallAt:2,pal:SILPAL}),y:P('yoann',380,{anim:'shake',expr:'cold',pal:SILPAL,go:[0,340,3]})},
 extra:(T)=>[1,1.4,2,2.3,2.6].map((d,i)=>ring(470+(i%3)*120,400,T[1]+d*.8,34)).join(''),
 beats:["Quand il a été assez près, j'ai saisi son poignet de la main gauche, le pouce appuyé juste sous l'os, et j'ai tordu d'un coup sec vers l'extérieur. Son coude a cédé. Le couteau a percuté le sol dans un bruit métallique clair. Avant qu'il ait le temps de réagir, mon poing droit est parti en crochet court, directement sur la tempe. Il a chancelé, les yeux déjà vides, et s'est effondré à côté de son arme.",
  "Les deux autres se sont jetés sur moi presque au même instant. Le premier a attrapé mon bras gauche : j'ai ramené le coude en arrière, violemment, juste sous les côtes. L'air est sorti de sa bouche en un son sourd. Je l'ai poussé contre le muret d'un coup d'épaule. Le second visait mon flanc : j'ai pivoté, bloqué son avant-bras avec le mien, et j'ai frappé du poing droit, deux fois de suite, directement dans le plexus. Un dernier coup, plus bas, sur le côté de la mâchoire, l'a envoyé au sol.",
  "En quelques secondes, ils étaient tous les trois à terre, groggy, sans plus vraiment chercher à se relever. Il ne restait plus que lui — celui qui portait encore la montre de Dylan au poignet. Figé. Le sourire complètement effacé."]});
shot({bg:'cour',tint:['#000',.55,0,.5],cast:{y:P('yoann',640,{y:640,rot:0,pal:SILPAL,anim:'shake',cls:'kneel',expr:'cold'}),v:P('thug',560,{y:660,rot:-88,pal:SILPAL,s:.95})},
 extra:(T)=>[0,.5,1,1.5,2,2.5,3,3.5].map(d=>ring(560,560,1+d,30)).join(''),
 beats:["Je n'ai pas hésité. J'ai pris de l'élan et je me suis jeté sur lui. Mon poing droit est parti en pleine course, droit sur le côté de sa tête. L'impact a claqué. Il a basculé en arrière sous le choc. Je suis tombé avec lui, mon genou à côté de son flanc, mon autre main plantée près de son épaule pour me stabiliser, et j'ai commencé à frapper.",
  "Poing gauche. Poing droit. Encore. Encore. Sur le visage, sans m'arrêter. Chaque coup faisait claquer sa tête contre le béton. Je n'entendais plus rien d'autre que le bruit sourd des impacts et mon propre souffle. Aucune pensée. Juste le geste qui se répétait, encore et encore, comme si quelque chose de bien plus ancien que moi avait enfin trouvé l'occasion de sortir tout entier, sans retenue, sans limite."]});
shot({bg:'cour',tint:['#06223a',.25,0],cast:{t:P('thug',700,{y:660,rot:-88,pal:SILPAL,s:.95}),y:P('yoann',560,{anim:'idle',expr:'sad'}),j:P('johann',720,{anim:'hug',expr:'fear',enter:'R',delay:.2}),d:P('dylan',1080,{expr:'fear',bruise:1,cls:'cower',at:3})},
 beats:["C'est Johann qui m'a arrêté. Il est arrivé en courant dans la cour, essoufflé, et il m'a agrippé par-derrière, les deux bras autour de mon torse, en hurlant mon prénom encore et encore. Quelque chose en moi a fini par entendre. Mes poings se sont arrêtés. Je me suis retourné, vraiment essoufflé pour la première fois de la soirée. Mes mains étaient rouges. Le sang coulait entre mes doigts, épais, collant.",
  "Un peu plus loin, une silhouette s'est détachée de l'ombre entre deux immeubles. Dylan. Malgré la douleur, malgré ce que je lui avais demandé, il n'avait pas pu rester assis sur ces marches à attendre sans savoir. Il avait dû me suivre à distance depuis le début, aussi vite que son dos le lui permettait, et il était arrivé juste après Johann, à temps pour voir la fin.",
  "Il me regardait. Et dans ses yeux, il n'y avait plus de gratitude. Seulement une peur crue, la même que j'avais déjà vue une fois, dans le hall de son immeuble. Une peur qui, maintenant, avait grandi jusqu'à occuper tout son visage.",
  "Sur le sol, la montre de Dylan avait glissé du poignet de l'un d'eux, abandonnée dans la lumière tremblante du lampadaire. Je me suis penché pour la ramasser, les mains encore tremblantes, sans un mot, pendant que Johann restait là, à me regarder comme s'il ne savait plus vraiment qui j'étais."]});

/* ================= CHAPITRE 13 ================= */
chap('Chapitre 13','Ce que ça coûte');
shot({bg:'chambre',cast:{y:yh(560,{expr:'sad',phone:1})},
 beats:["Les jours qui ont suivi n'ont pas ressemblé à ceux d'après Sarah. Après Sarah, il y avait eu cette étreinte, cette gratitude qui avait fini par recouvrir le reste. Cette fois, il n'y avait rien de tel à quoi se raccrocher. Juste l'attente, sourde, d'une conséquence que je ne pouvais pas encore nommer. Johann m'a appelé le lendemain, la voix tendue.",
  ['@900,330',"Le type que t'as... enfin, celui d'hier soir. Il est à l'hôpital. Nez cassé, une commotion, plusieurs points de suture. J'ai eu l'info par un pote qui connaît quelqu'un du quartier.",'msg2'],
  ['y',"Grave comment ?"],['@900,330',"Pas mortel. Mais pas rien non plus, Yoann.",'msg2'],
  "J'ai raccroché sans trouver quoi répondre. Pendant plusieurs jours, j'ai vérifié mon téléphone à intervalles réguliers, une appréhension nouvelle nichée entre les côtes, guettant une notification, un appel de numéro inconnu. Rien n'est venu.",
  "J'ai fini par comprendre que le groupe n'avait rien déclaré à la police. Ils avaient volé Dylan avant de se faire tabasser : expliquer l'un sans l'autre aurait été compliqué pour eux. Ça n'a rien réglé. Ça a juste transformé une peur concrète en une autre, plus diffuse, parce qu'elle n'avait pas de date d'expiration."]});
shot({bg:'lit',extra:heads(560),
 beats:["Avec Dylan, les choses ne sont pas redevenues comme avant. Il ne m'a pas évité, exactement. Mais il y avait, dans nos retrouvailles, une prudence nouvelle, comme un espace qu'il gardait entre nous sans jamais le nommer. Un soir, allongés dans le noir comme tant de fois avant, j'ai fini par lui demander directement.",
  ['@640,420',"T'as peur de moi, maintenant ?",'msg'],
  "Il a mis longtemps à répondre, assez longtemps pour que la question elle-même devienne une réponse.",
  ['@640,420',"Un peu, ouais. Pas tout le temps. Mais des fois, quand je repense à ton visage cette nuit-là, avant que tu partes... ouais. J'ai peur.",'msg2'],
  ['@640,420',"Tu veux qu'on arrête ?",'msg'],
  ['@640,420',"Non. Je veux juste que tu comprennes que t'as changé quelque chose, ce soir-là. Entre nous. Je sais pas encore comment on répare ça. Mais je pars pas.",'msg2'],
  "Ce n'était pas un pardon complet. C'était juste la vérité, posée entre nous, sans fard."]});
shot({bg:'lycee',cast:{l:P('lohane',500,{expr:'cry'}),y:P('yoann',780,{expr:'sad'})},
 beats:["Avec Lohane, la conversation a été plus dure encore. Elle m'a retrouvé au lycée, quelques jours après, et elle n'a pas pris de gants.",
  ['l',"Cette fois, c'est pas pareil. La dernière fois, tu leur as fait peur. Cette fois, t'as fait couler du sang, Yoann. Un vrai sang, un vrai hôpital. J'ai été patiente la dernière fois parce que je comprenais ce que tu ressentais. Mais là, je peux plus juste te dire « fais gaffe à toi ». Je dois te demander : est-ce que tu vas recommencer ?"],
  ['y',"Je sais pas."],
  ['l',"C'est pas une réponse suffisante. Tu vois pas ? Ceux que t'aimes ont peur pour toi autant que de toi, maintenant. C'est ça, le prix. C'est ça que ça coûte."],
  "Elle est partie sans attendre ma réponse, les larmes aux yeux pour la première fois depuis que je la connaissais, et je suis resté là, seul, avec cette phrase qui tournait en boucle, refusant de se laisser oublier."]});
shot({bg:'sdb',cast:{y:P('yoann',640,{y:640,coat:false,expr:'sad'})},
 extra:A('yoann',{x:640,y:370,s:.55,coat:false,expr:'sad',pal:{top:'#16171b'},anim:'none'})+R(530,120,220,260,'#7fb5cf','opacity=".25"'),
 beats:["La nuit suivante, je n'ai pas dormi. J'ai repensé à tout — le collège, le bureau, le vertige de cette première trahison. Le mur. Sarah, Manon, Lucas, à genoux. Le sang entre mes doigts, sous ce lampadaire qui clignotait. Chaque étape m'avait semblé, sur le moment, justifiée, presque inévitable. Mais mises bout à bout, elles dessinaient une trajectoire que je ne savais plus très bien où elle s'arrêterait, ni si je serais encore capable de l'arrêter moi-même la prochaine fois.",
  "Je me suis regardé dans le miroir de la salle de bain, longtemps, comme si le reflet allait finir par me donner une réponse que je ne trouvais pas seul. Il n'a rien dit. Évidemment."]});

/* ================= CHAPITRE 14 ================= */
chap('Chapitre 14','Ce que je suis devenu');
shot({bg:'rueJ',cast:{y:P('yoann',640,{anim:'walk',it:999,expr:'neutral'})},
 beats:["Les semaines ont passé, puis les mois, sans qu'aucun coup de fil de la police, aucune convocation, aucune conséquence extérieure ne vienne jamais réclamer son dû. Le silence a fini par devenir une forme d'habitude, presque rassurante à force de durer, même si je savais qu'il ne signifiait rien de plus qu'un sursis dont j'ignorais la date d'expiration.",
  "Le type que j'avais frappé s'est remis, à ce que Johann a fini par apprendre par des voies détournées. Le nez ressoudé de travers, une cicatrice au sourcil, plus de nouvelles ensuite. Ni lui ni les autres n'ont plus jamais approché Dylan, ni cherché à savoir qui j'étais vraiment. La peur, cette fois encore, avait suffi à fermer cette porte-là."]});
shot({bg:'quaiF',cast:{d:P('dylan',640,{expr:'smile'}),y:P('yoann',160,{anim:'walk',go:[0,330,3],expr:'smile'})},
 beats:["Avec Dylan, on a continué. Pas comme avant — cet « avant » n'existait plus vraiment, quelque part entre le mur et cette cour éclairée d'un lampadaire à moitié grillé. Mais autrement, avec cette prudence qu'il avait nommée cette nuit-là, et qui ne s'était jamais tout à fait dissipée.",
  "Il continuait de m'attendre à la sortie du RER. Sa main continuait de chercher la mienne, presque par réflexe, dans le noir. Mais je voyais, parfois, une seconde d'hésitation avant qu'il ne s'approche, un temps de retard qui n'existait pas avant, et qui ne s'effacerait sans doute jamais complètement. On n'en parlait plus directement. C'était devenu une donnée silencieuse de nous deux, quelque chose qu'on portait ensemble sans avoir besoin de le nommer."]});
shot({bg:'rueJ',tint:['#e49b3a',.2,0],cast:{l:P('lohane',500,{anim:'walk',go:[0,160,16],expr:'smile'}),y:P('yoann',720,{anim:'walk',go:[0,160,16],expr:'smile'})},
 beats:["Avec Lohane, les choses ont mis plus longtemps à se réchauffer. Elle n'a jamais retiré ce qu'elle m'avait dit, et je ne le lui ai jamais demandé. Mais elle est revenue, peu à peu, avec cette légèreté qu'on avait toujours partagée, ce rire facile qu'aucune des deux nuits n'avait réussi à éteindre complètement chez elle.",
  "Un soir qu'on rentrait à pied, sans but précis, elle a fini par me poser une question qu'elle devait retourner dans sa tête depuis un moment, sur un ton qui se voulait léger mais qui ne l'était qu'à moitié.",
  ['l',"Jusqu'où t'irais, pour nous ? Pour moi, pour Johann, pour Dylan ?"],
  "J'ai souri, à moitié, sans vraiment répondre d'abord.",
  ['y',"Loin. T'as pas envie de savoir jusqu'où."],
  "Elle a insisté un peu, en riant, cherchant à me faire dire quelque chose de plus précis. J'ai fini par ajouter, sur ce même ton léger, presque en plaisantant à moitié :",
  ['y',"Je crois que je pourrais me sacrifier pour toi. Sans hésiter."],['l',"T'es dramatique."],
  ['y',"Je dis ça sérieusement. Comme je te le dis depuis le début de notre amitié : je pourrais faire énormément de choses pour toi."],
  "Elle a ri, m'a donné un coup d'épaule, et le moment est passé, léger en apparence, comme tant d'autres."]});
shot({bg:'chambreJ',cast:{j:P('johann',520,{expr:'smile'}),y:P('yoann',820,{coat:false,expr:'neutral'})},
 beats:["Johann, lui, semblait avoir fait sa paix avec cette part de moi plus vite que les autres — peut-être parce que c'était pour lui, la première fois, que tout avait commencé. Il ne me posait plus la question de savoir si je recommencerais. Je crois qu'il avait compris qu'aucune réponse ne le rassurerait vraiment, et qu'il avait choisi, malgré tout, de rester à côté de moi.",
  "Il y avait autre chose, aussi, que je n'ai raconté à personne : une fatigue qui s'était installée quelque part en moi, plus profonde que celle des nuits trop courtes, une fatigue qui ne se dormait pas, qui restait là au réveil comme si elle avait continué de veiller pendant que je dormais.",
  ['j',"T'as l'air crevé, ces derniers temps."],['y',"Je suis fatigué. Mais pas d'une fatigue qui se dort."],
  "Il a ri, a pris ça pour une formule. Je n'ai pas cherché à expliquer davantage. Je ne suis pas sûr d'avoir eu, moi-même, les mots pour le faire."]});
shot({bg:'salon',table:[380,900,480,'#9c7a52','#7d5f3d'],cast:{m:P('mere',480,{expr:'neutral'}),y:P('yoann',800,{coat:false,expr:'neutral'})},
 beats:["Avec ma mère, l'équilibre fragile qu'on avait trouvé après le mur a tenu, sans jamais vraiment se consolider ni se briser. Je ne lui ai jamais raconté ni Sarah, ni la cour, ni le sang sous le lampadaire. Elle ne m'a jamais redemandé. On avait chacun choisi de vivre avec cette part d'ombre qu'on se refusait mutuellement à éclairer, et c'était peut-être, pour nous deux, la seule forme de paix possible."]});
shot({bg:'lit',extra:heads(560),
 beats:["Un soir de printemps, allongé contre Dylan, sa tête posée sur mon épaule, il a fini par poser la question que je sentais suspendue entre nous depuis des mois.",
  ['@640,420',"Tu penses que ça va se reproduire ? Un jour ?",'msg2'],
  "J'ai pris le temps d'y réfléchir vraiment, cette fois, plutôt que de répondre par réflexe comme je l'avais fait avec Johann, puis avec Lohane.",
  ['@640,420',"Je sais pas. Je peux pas te promettre que non. Je peux juste te dire que je sais, maintenant, ce que ça coûte. Ce que ça vous coûte, à vous. Et que j'ai pas envie de vous perdre pour ça.",'msg'],
  ['@640,420',"C'est pas vraiment une réponse rassurante.",'msg2'],['@640,420',"Non. Mais c'est la vraie.",'msg'],
  "Il n'a rien ajouté. Sa main a cherché la mienne, comme toujours, et cette fois, il n'y a pas eu d'hésitation."]});
shot({bg:()=>sceneTitleIceberg(true),
 extra:`<g class="ghost" style="--gd:6s">${A('yoann',{x:690,y:660,s:1.15,pal:GHOSTPAL,expr:'cold',anim:'idle'})}</g>`,
 beats:["Je pense souvent à ce jour au collège, à ce bureau, à cette phrase qui avait tout déclenché sans que je m'en rende compte. Ils étaient là pour ce que je pouvais leur donner. Je pensais, à l'époque, que quelque chose s'était éteint en moi ce jour-là. Je sais maintenant que ce n'était pas tout à fait vrai.",
  "Rien ne s'éteint jamais complètement. Ça se transforme, ça se love quelque part au fond de soi, en attendant son heure — et parfois, cette heure arrive, avec toute la violence de ce qu'on avait cru disparu depuis longtemps.",
  "Je ne sais pas ce que je suis vraiment. Un lycéen ordinaire, la plupart du temps, avec ses habitudes, ses trajets, ses gens. Et, en dessous, cette autre chose, plus ancienne, plus lourde, dont je continue d'apprendre le poids exact chaque fois qu'elle se réveille. La partie émergée de l'iceberg, et tout le reste, en dessous, que je porte seul, désormais, en sachant enfin exactement à quoi il ressemble."]});

/* ================= CHAPITRE 15 ================= */
chap('Chapitre 15','Ce que j\'avais promis');
shot({bg:'rueJ',tint:['#3c4a63',.4,0],cast:{l:P('lohane',520,{anim:'walk',go:[0,200,18],expr:'neutral'}),y:P('yoann',720,{anim:'walk',go:[0,200,18],expr:'sad'})},
 beats:["La journée avait été longue d'une façon qui n'avait rien de spectaculaire. Juste une succession de petites usures : un contrôle raté qu'on m'avait demandé d'expliquer encore une fois, ma mère qui m'avait interrogé trop longtemps sur mon silence, un message de Dylan resté sans réponse parce que je n'avais plus la force d'en formuler une, et cette fatigue sourde qui s'était installée dans les épaules depuis le matin, comme si mon corps avait déjà décidé que la journée devait s'arrêter avant moi.",
  "Lohane et moi marchions sans but précis. On avait quitté le lycée plus tard que d'habitude, après avoir attendu Johann qui n'était finalement pas venu. Le ciel était déjà bas, la lumière grise de fin d'après-midi collée aux façades. On parlait de rien, ou presque — d'un film qu'elle voulait voir, d'un professeur qui avait encore oublié mon prénom. Des phrases légères, destinées à remplir l'espace sans jamais le trop remplir."]});
shot({bg:'rueJ',tint:['#3c4a63',.4,0],cast:{l:P('lohane',620,{expr:'fear',anim:'idle'}),y:P('yoann',480,{expr:'sad'}),h:P('thug',1050,{anim:'walk',knife:1,go:[0,-210,1.4],at:0})},
 beats:["C'est à ce moment-là que l'homme est apparu. Il sortait de nulle part, ou plutôt d'un angle mort entre deux immeubles, la tête baissée sous une capuche, les mains dans les poches. On ne l'a pas vraiment remarqué tout de suite. Puis il a accéléré, s'est planté devant nous, et a sorti le couteau d'un geste sec, presque professionnel.",
  ['h',"Les téléphones. Les sacs. Maintenant."],
  "Sa voix était plate. Pas de menace théâtrale, juste une certitude. Lohane a reculé d'un demi-pas.",
  ['l',"On a rien. Laissez-nous passer."],
  "Moi, j'ai senti mon corps se figer, non pas de peur — la peur n'existait presque plus depuis longtemps — mais d'une exhaustion si totale que même la bascule habituelle mettait du temps à se déclencher. Mes muscles étaient lourds. Mes mains tremblaient légèrement, non de colère, mais de pure fatigue. Il a avancé d'un pas vers elle.",
  ['y',"Lohane, bouge pas."],
  "Elle n'a pas bougé. Ses yeux étaient fixés sur la lame."]});
shot({bg:'rueJ',tint:['#3c4a63',.4,0],cast:{l:P('lohane',620,{expr:'fear',anim:'idle'}),h:P('thug',840,{knife:1,anim:'idle'}),y:P('yoann',480,{expr:'cold',anim:'walk',go:[0,220,.9]})},
 extra:(T)=>`<g class="txt" style="--d:${(T[1]+.9).toFixed(1)}s"><circle cx="720" cy="470" r="90" fill="url(#glowB)"/></g>`+ring(720,470,T[1]+.9,50),
 beats:["Je n'ai pas réfléchi. Je n'ai même pas eu le temps de ressentir la bascule. Mon corps a simplement bougé. Je me suis mis devant elle.",
  "La lame est entrée en bas, sous les côtes, un peu sur le côté. La douleur est arrivée en retard, comme toujours. D'abord une pression tiède, presque abstraite, puis une brûlure sourde qui s'est répandue en éventail.",
  ['l',"YOANN !"],
  "Son cri a déchiré l'air. J'ai entendu le bruit de ses chaussures sur le bitume, puis ses mains qui s'agrippaient déjà à mon bras. J'ai posé une main sur son épaule pour la garder derrière moi. Avec l'autre, j'ai saisi le poignet de l'homme. Mes doigts étaient déjà glissants. J'ai tordu, une fois, avec tout ce qu'il me restait."]});
shot({bg:'rueJ',tint:['#3c4a63',.45,0],cast:{h:P('thug',900,{y:660,rot:-88,anim:'none',s:1}),l:P('lohane',560,{anim:'kneel',expr:'cry',cls:'press'}),y:P('yoann',720,{anim:'kneel',expr:'shut'})},
 extra:C(720,520,26,'#a8222b','opacity=".7"'),
 beats:["Le couteau a claqué sur le sol. Il a voulu se dégager. Je l'ai frappé du genou, une seule fois, assez fort pour qu'il s'affaisse. Puis j'ai basculé avec lui, mon poids sur le sien, jusqu'à ce qu'il cesse de bouger.",
  "Trop tard. Je suis resté à genoux. La chaleur s'écoulait entre mes doigts. Lohane s'était agenouillée face à moi, ses mains déjà sur mon flanc, pressant de toutes ses forces."]});
shot({bg:'rueJ',tint:['#1b2433',.55,0],cast:{y:P('yoann',900,{y:610,rot:-90,anim:'none',expr:'shut',bub:[570,500]}),l:P('lohane',520,{y:640,anim:'kneel',expr:'cry',cls:'press'})},
 extra:(T,D)=>`<g class="txt" style="--d:2s"><circle cx="760" cy="590" r="70" fill="url(#glowB)" opacity=".5"/></g><rect class="tint" width="1280" height="720" fill="#fff" style="--o:1;--d:${(D-6).toFixed(1)}s;--u:5s"/>`,
 beats:[['l',"Respire… Yoann, regarde-moi. Ne ferme pas les yeux, d'accord ? Regarde-moi."],['y',"Je te regarde…"],['l',"Tais-toi. Garde ta force. Je vais appeler, je…"],
  ['y',"Lohane. Je te l'avais dit. Que je pourrais me sacrifier pour toi."],['l',"Arrête. Arrête de parler comme ça. T'as pas le droit."],
  ['y',"Tu te souviens ? Un soir… tu m'avais demandé jusqu'où j'irais pour vous. Pour toi. Pour Johann. Pour Dylan."],['l',"Je m'en fous de ce que t'avais dit. Je veux pas que tu le prouves. Pas comme ça."],
  ['y',"C'est trop tard."],['l',"Non. Non, c'est pas trop tard. Tu vas tenir. Tu m'entends ? Tu vas tenir le temps que les secours arrivent."],
  ['y',"Dis-leur… à ma mère. À mon père. À Johann. À Dylan. Dis-leur que c'était pour toi. Que j'ai choisi. Que j'ai pas hésité."],
  ['l',"Je veux pas leur dire ça. Je veux pas leur dire que t'es mort pour moi. Je veux pas porter ça."],
  ['y',"Tu vas le porter. Comme j'ai porté le reste. C'est juste… le dernier truc."],['l',"Yoann… s'il te plaît. Ne me laisse pas seule avec ça."],
  ['y',"Tu restes. Tu parles. Tu vis. C'est tout ce que je te demande."],['l',"Et moi, je te demande de rester. Juste… reste. Une minute de plus. Deux minutes. Le temps qu'ils arrivent."],
  ['y',"Je suis déjà trop fatigué, Lohane. Depuis ce matin. Depuis… depuis longtemps, en fait."],['l',"Alors repose-toi après. Pas maintenant. Pas ici."],
  "Le froid était revenu, plus large cette fois. Plus doux. Comme si la partie immergée remontait enfin pour tout emporter avec elle.",
  ['y',"Je t'aime bien, tu sais. Toi, Johann, Dylan… vous étiez les seuls pour qui ça valait encore le coup."],['l',"Alors prouve-le en restant en vie, putain."],
  ['y',"Dis-leur… que j'ai pas eu peur. À la fin. Et que… que la partie immergée… elle a fini par sortir. Mais pour une bonne raison, cette fois."],
  ['l',"Je te déteste d'avoir fait ça."],['y',"Non. Tu me détestes pas."],['l',"Si. Un peu. Beaucoup. Reste quand même."],
  ['y',"Lohane… Merci d'avoir été là. Même les jours où j'étais… loin."],['l',"Arrête de parler au passé."],['y',"C'est la fin pour moi. Mais pas pour toi."],
  ['l',"Yoann… s'il te plaît… ne me quitte pas maintenant. Je t'en supplie…"],
  "La lumière a commencé à s'effacer par les bords. Sa voix est devenue plus lointaine, plus étouffée. Puis plus rien. Juste le silence. Et, quelque part en dessous, la sensation nette, presque apaisante, d'avoir enfin touché le fond."]});

/* ================= CHAPITRE 16 ================= */
chap('Chapitre 16','Ce que je devais dire');
shot({bg:'rueN',cast:{l:P('lohane',640,{anim:'kneel',expr:'cry',cls:'hands',y:640})},
 extra:`<g class="flk"><rect x="0" y="560" width="640" height="160" fill="#2a5cff" opacity=".18"/><rect x="640" y="560" width="640" height="160" fill="#ff2a2a" opacity=".18"/></g>`+R(500,640,0,0,'#000'),
 beats:["(À partir d'ici, ce n'est plus Yoann qui parle. Il ne peut plus. C'est Lohane qui continue, parce que quelqu'un doit le faire, et parce qu'il le lui a demandé.)",
  "Les secours sont arrivés douze minutes après mon appel. Je le sais parce que je n'ai pas arrêté de regarder l'heure sur mon téléphone, posé à côté de moi sur le trottoir, comme si le compter allait changer quoi que ce soit.",
  "Douze minutes, les mains toujours pressées contre son flanc alors qu'il n'y avait plus rien à retenir, un policier qui m'a écartée doucement pour laisser travailler les ambulanciers, une couverture argentée posée sur mes épaules sans que je comprenne pourquoi j'en avais besoin puisque je n'avais pas froid — je n'avais plus rien du tout. Je ne me souviens pas du trajet jusqu'au commissariat, ni de grand-chose de ce qu'on m'a demandé là-bas. Je me souviens juste d'avoir regardé mes mains, longtemps, en essayant de comprendre à quel moment exactement elles avaient arrêté d'être les miennes.",
  "Ce qui m'est resté, en revanche, avec une netteté presque insupportable, c'est la liste. Il fallait prévenir des gens. Dylan. Johann. Sa mère. Son père. Et il fallait que ce soit moi, parce que j'étais la seule à savoir, la seule qui avait été là."]});
shot({bg:'hall',tint:['#5a6270',.3,0],cast:{l:P('lohane',420,{expr:'cry'}),d:P('dylan',760,{expr:'smile'})},
 beats:["Je suis allée voir Dylan en premier, le lendemain matin, parce que je ne pouvais pas me résoudre à le faire par téléphone, pas pour ça. Il m'a ouvert la porte avec ce sourire qu'il a toujours en me voyant, un sourire qui s'est effacé en une fraction de seconde en découvrant mon visage.",
  ['d',"Lohane ? Qu'est-ce qui se passe ?"],
  "Je n'ai pas réussi à répondre tout de suite. Ma gorge s'est fermée complètement. Puis j'ai dit les mots, sans préambule, parce qu'il n'y avait aucune façon douce de les formuler.",
  ['l',"Yoann est mort hier soir. Il s'est interposé pour me protéger. Il est mort dans mes bras."],
  "Le silence a duré une éternité. Puis j'ai vu quelque chose se briser sur son visage, quelque chose que je n'oublierai jamais, et il s'est laissé glisser contre le mur de son entrée jusqu'au sol, sans un bruit, les mains sur la bouche comme pour empêcher un cri de sortir."]});
shot({bg:'hall',tint:['#5a6270',.3,0],cast:{l:P('lohane',520,{anim:'kneel',expr:'cry'}),d:P('dylan',760,{anim:'kneel',expr:'cry',cls:'hands'})},
 beats:["Je me suis assise à côté de lui, incapable de trouver quoi que ce soit à dire qui n'aggraverait pas les choses, et c'est lui, au bout d'un long moment, la voix cassée en mille morceaux, qui a fini par poser sa main sur mon épaule.",
  ['d',"T'étais avec lui. Tu... ça va, toi ?"],
  "Je me souviens d'avoir presque ri, d'un rire qui n'en était pas un, devant l'absurdité de la question. Lui venait d'apprendre que l'homme qu'il aimait était mort, et c'était lui qui demandait si j'allais bien. On est restés comme ça un long moment, par terre dans son entrée, moi qui pleurais enfin pour de vrai depuis la veille, et lui qui me tenait contre lui alors qu'il aurait eu toutes les raisons du monde de s'effondrer avant moi.",
  ['l',"Il a dit un truc, avant. Il voulait que je te le dise. Que c'était pour moi qu'il avait choisi. Qu'il avait pas hésité."],
  "Dylan a fermé les yeux, longtemps, et quand il les a rouverts, il y avait quelque chose de plus calme dedans, une tristesse qui commençait déjà à se réorganiser autour de ce qu'il venait d'apprendre.",
  ['d',"Ça lui ressemble. C'est exactement le genre de truc qu'il aurait fait."]]});
shot({bg:'lycee',tint:['#5a6270',.3,0],cast:{j:P('johann',640,{expr:'smile',phone:1}),l:P('lohane',1000,{expr:'cry',go:[0,-250,2.5]})},
 beats:["Je l'ai retrouvé le même après-midi, devant le lycée, à l'endroit où on l'attendait toujours tous les deux, adossé à la rambarde, le téléphone à la main comme chaque jour. Il a levé les yeux vers moi, et j'ai vu son visage changer avant même que j'arrive à sa hauteur.",
  ['j',"Lohane. Où est Yoann ? Il répond pas depuis hier soir."],
  "Je n'ai pas trouvé d'entrée en matière. J'ai juste dit les mots, exactement les mêmes qu'à Dylan.",
  ['l',"Il est mort, Johann. Hier soir. Il s'est mis devant moi."]]});
shot({bg:'lycee',tint:['#5a6270',.3,0],cast:{j:P('johann',560,{anim:'kneel',expr:'cry'}),l:P('lohane',760,{anim:'kneel',expr:'cry'})},
 beats:["Johann n'a rien dit pendant plusieurs secondes. Il a juste secoué la tête, lentement, comme si le geste seul pouvait annuler ce que je venais de dire, et j'ai vu ses jambes flancher avant qu'il ne s'appuie contre la rambarde.",
  ['j',"Non. Non, c'est pas possible, il devait passer chez moi ce soir, on avait prévu de..."],
  "Il n'a pas terminé sa phrase. Il s'est mis à pleurer, d'un coup, ce même Johann qui ne pleure jamais, qui trouve toujours une vanne pour désamorcer les pires moments, et je l'ai vu chercher cette vanne, cette fois, sans jamais la trouver. On s'est assis par terre, contre le mur du lycée, et c'est encore lui qui a fini par essuyer mes larmes avant les siennes.",
  ['j',"C'est de ma faute, en partie. Tout ça a commencé avec moi. Avec Sarah."],
  ['l',"Non. Ça n'a jamais été de ta faute. Ça n'a jamais été de la faute de personne, sauf de celui qui tenait le couteau."],
  "Il a hoché la tête, sans vraiment y croire, et on est restés assis là un long moment, deux personnes essayant de porter ensemble un poids que ni l'une ni l'autre n'arrivait à soulever seule."]});
shot({bg:'porte',tint:['#5a6270',.3,0],cast:{m:P('mere',420,{expr:'neutral',pal:{top:'#7b4c75'}}),j:P('johann',840,{expr:'sad'}),l:P('lohane',990,{expr:'sad'})},
 beats:["C'est Johann qui a proposé qu'on y aille ensemble, le soir même, avant que la nouvelle ne leur parvienne d'une autre façon, par la police ou par quelqu'un qui n'aurait pas les mots justes. On est allés chez sa mère en premier. Elle nous a ouvert la porte avec ce sourire un peu fatigué qu'elle avait toujours en fin de journée, un sourire qui a mis moins d'une seconde à s'effacer en nous voyant tous les deux sur le pas de la porte, à cette heure, avec ces visages-là.",
  ['m',"Qu'est-ce qui se passe ? Où est Yoann ?"],
  "Ni Johann ni moi n'avons réussi à parler tout de suite. C'est elle, finalement, qui a compris avant qu'on ait dit un mot, à la façon dont on se tenait, à la façon dont on n'arrivait pas à croiser son regard."]});
shot({bg:'porte',tint:['#5a6270',.3,0],cast:{m:P('mere',560,{y:640,anim:'kneel',expr:'cry',cls:'hands'}),j:P('johann',780,{anim:'kneel',expr:'cry',cls:'hands'}),l:P('lohane',960,{expr:'cry'})},
 beats:["Elle a porté une main à sa bouche, a reculé d'un pas dans l'entrée, et s'est laissée tomber sur la première marche de l'escalier, comme si ses jambes avaient cessé de la porter d'un coup.",
  ['m',"Non. Non, non, non."],
  "Johann s'est agenouillé devant elle, a pris ses mains dans les siennes, et c'est lui qui a fini par dire les mots, parce que je n'y arrivais plus.",
  ['j',"Il s'est interposé pour protéger Lohane. Il n'a pas souffert longtemps. Il a pensé à vous, à la fin."],
  "Ce n'était pas tout à fait vrai — je ne savais pas, en réalité, s'il avait pensé à eux dans ces dernières secondes, seulement à moi, à ce qu'il fallait que je dise — mais je n'ai pas corrigé Johann. Certains mensonges-là, je crois, ont plus de valeur que la vérité.",
  "On est restés avec elle une heure, peut-être plus, sans qu'elle arrive à formuler une phrase entière, jusqu'à ce qu'elle nous demande, d'une voix presque inaudible, si quelqu'un avait prévenu son père. Elle a insisté pour être celle qui l'appellerait elle-même, malgré tout, parce que :",
  ['m',"Ça, au moins, c'est à moi de le faire."]]});
shot({bg:'cuisine',tint:['#5a6270',.35,0],cast:{p:P('pere',640,{expr:'sad',beard:1,phone:1,anim:'idle'})},
 beats:["Elle nous a raconté, plus tard dans la soirée, ce que ça avait donné : un silence interminable au bout du fil, puis une seule question, répétée trois fois, avant qu'il ne raccroche sans un mot de plus, incapable, comme elle, de faire tenir tout ça dans une phrase.",
  ['p',"Il a souffert ?"],['p',"Il a souffert ?"],['p',"Il a souffert ?"],
  "Je n'ai plus jamais reparlé de cette soirée avec Johann, dans les mois qui ont suivi. Mais quelque chose s'était installé entre nous ce soir-là, quelque chose que Yoann, de son vivant, n'avait jamais laissé exister — deux personnes qui, séparément, avaient occupé une place différente dans sa vie, et qui se retrouvaient, pour la première fois, à porter ensemble ce qu'il en restait."]});

/* ================= CHAPITRE 17 ================= */
chap('Chapitre 17','Ceux qui veillent');
shot({bg:'lycee',tint:['#032439',.3,3],cast:{j:P('johann',300,{expr:'neutral'}),s:P('sarah',700,{expr:'smirk',at:0,rx:-120,rxAt:2}),y:P('yoann',0,{x:300,s:1})},ghost:[['j',3]],
 beats:["Les mois qui ont suivi ont été traversés de récits que je n'ai pas vécus moi-même, pour trois d'entre eux, mais qu'on m'a racontés avec assez de détails, et assez de peur dans la voix, pour que je finisse par y croire complètement. Je les note ici dans l'ordre où je les ai appris, parce que c'est peut-être la seule façon que j'ai de continuer à faire ce que Yoann m'a demandé ce soir-là : porter son histoire, jusqu'au bout.",
  "Trois mois après l'enterrement, la rumeur de la mort de Yoann avait fini par circuler jusqu'au cercle de Sarah — quelqu'un l'avait su par la mère de Yoann, qui l'avait mentionné sans y penser à une voisine. Sarah avait dû se dire que le champ était libre. Elle est revenue une seule fois, un jeudi après les cours, plantée devant le lycée avec ce même sourire qui montre beaucoup de dents, à attendre Johann comme si les mois n'avaient jamais existé.",
  "Johann dit qu'il l'a vue de loin, qu'il a senti son sang se glacer avant même de comprendre pourquoi. Mais Sarah, elle, ne l'a jamais vraiment approché. Il l'a vue se figer à une dizaine de mètres de lui, le visage soudain vidé de toute assurance, comme si elle venait de percevoir un froid, une présence, quelque chose qui n'avait ni forme ni source identifiable mais qui suffisait à faire reculer n'importe qui d'un pas.",
  "Elle a tourné les talons sans un mot, presque en courant, et elle n'est jamais revenue. Le lendemain, en rentrant chez lui, Johann a trouvé sur le paillasson, sans qu'aucune caméra d'immeuble n'ait rien enregistré d'anormal, un vieux composant électronique qu'il avait offert à Yoann des années plus tôt pour une blague, un objet qu'il pensait perdu depuis longtemps. Il l'a gardé, depuis, sur son bureau, à côté de son ordinateur."]});
shot({bg:'rueN',tint:['#032439',.3,0],cast:{d:P('dylan',360,{expr:'fear'}),a:P('thug',820,{s:.95,expr:'neutral',rx:-80,rxAt:3}),b:P('thug',960,{s:.95,rx:-80,rxAt:3}),f:P('thug',1180,{s:.95,anim:'run',go:[4,-100,.1],op:0})},ghost:[['d',3]],
 beats:["Deux des garçons qui l'avaient agressé cet hiver-là, remis de leurs blessures depuis longtemps, avaient décidé de revenir. Peut-être par rancune, peut-être parce qu'ils avaient appris, eux aussi, que celui qui les avait punis n'était plus là pour recommencer. Ils l'ont attendu un soir, à la sortie de son travail, dans une rue qu'il empruntait toujours pour rentrer.",
  "Dylan m'a dit qu'il les avait reconnus tout de suite, malgré la nuit, malgré les mois passés, à cette façon qu'ils avaient de se tenir, un peu penchés en avant, comme prêts à bondir. Il s'est arrêté, le cœur battant, certain que cette fois, personne ne viendrait.",
  "Et puis, m'a-t-il dit, quelque chose a changé sur leurs visages. Un frisson, une hésitation soudaine, comme si l'air lui-même s'était alourdi d'un coup autour d'eux.",
  "L'un des deux a reculé le premier, puis l'autre, et ils sont partis en courant sans qu'un seul coup n'ait été échangé, sans qu'un seul mot n'ait même été prononcé. Dylan est resté seul au milieu de la rue, tremblant, avec la certitude étrange de ne pas avoir été seul à cet instant précis.",
  "Le lendemain, en fouillant dans un tiroir qu'il n'avait pas ouvert depuis des mois, il est tombé sur la montre qu'on lui avait volée cette nuit-là, celle que Yoann avait récupérée dans la cour au lampadaire cassé. Il était certain de l'avoir rangée ailleurs. Il ne l'a plus jamais quittée depuis."]});
shot({bg:'rueN',tint:['#032439',.3,0],cast:{m:P('mere',420,{expr:'fear'}),h:P('thug',760,{pal:{top:'#4a3b30',hair:'#222',hs:'short'},rx:-90,rxAt:3,expr:'smirk'})},ghost:[['m',3]],
 beats:["La mère de Yoann rentrait d'une soirée entre amies, tard. Un homme l'avait abordée dans la rue, près de chez elle, d'abord de façon presque banale — un compliment, une question sur son chemin. Elle avait continué à marcher, poliment, en essayant de rester courtoise sans l'encourager, et l'homme, peu à peu, avait changé de ton, s'était rapproché plus qu'il n'aurait dû, avait insisté d'une voix qui n'avait plus rien d'aimable. Elle a dit qu'elle avait eu peur, une peur simple, ordinaire, celle qu'on ressent quand on est une femme seule dans une rue vide la nuit.",
  "Et puis, m'a-t-elle raconté, quelque chose avait changé dans le regard de cet homme. Il s'était arrêté net, au milieu d'une phrase, le visage soudain vidé de toute assurance, comme s'il venait de sentir quelque chose derrière elle, quelque chose qu'elle-même n'avait ni vu ni entendu. Il avait reculé, marmonné une excuse incohérente, et il était parti presque en courant, sans se retourner."]});
shot({bg:'porte',tint:['#032439',.25,0],cast:{m:P('mere',640,{expr:'fear',anim:'idle'})},extra:R(380,470,520,16,'#6b4a2e')+R(400,486,480,154,'#523922')+R(580,420,70,50,'#eee','rx="4"')+R(588,428,54,34,'#6b8cae'),
 beats:["Elle n'a jamais raconté cette histoire à personne d'autre que moi. Je crois qu'elle avait trop peur qu'on la prenne pour folle. Mais elle m'a dit une chose, ce soir-là, qu'elle n'admettrait sans doute jamais devant quelqu'un d'autre : qu'en rentrant chez elle, sur la table de l'entrée, une photo de Yoann qu'elle gardait toujours rangée dans un tiroir se trouvait posée bien en évidence, comme si quelqu'un l'avait sortie pour elle.",
  "Elle vit seule. Personne d'autre n'a les clés."]});
shot({bg:'rueN',tint:['#032439',.3,0],cast:{l:P('lohane',300,{expr:'fear',anim:'walk',go:[0,300,3]}),a:P('thug',900,{s:.95,expr:'neutral',rx:-80,rxAt:2,anim:'walk',go:[0,-280,3]}),b:P('thug',1050,{s:.95,rx:-80,rxAt:2,anim:'walk',go:[0,-280,3]})},ghost:[['l',2]],
 beats:["La dernière histoire, je l'ai vécue moi-même, et c'est peut-être celle que j'ai le plus de mal à raconter, parce que je n'ai aucune distance avec elle. C'était un soir, à la sortie du lycée, plusieurs mois après. Je rentrais seule, sur ce trajet que je connais par cœur, et j'ai remarqué deux garçons qui me suivaient depuis un moment, à distance, avec cette façon de marcher un peu trop synchronisée avec la mienne pour être un hasard.",
  "J'ai accéléré. Ils ont accéléré aussi. Je me souviens d'avoir eu peur, vraiment peur, d'une manière que je n'avais plus ressentie depuis cette nuit-là, dans la rue, avec Yoann à mes pieds. J'ai pensé, absurdement, que j'aurais donné n'importe quoi pour qu'il soit là, à cet instant précis, pour qu'il apparaisse au coin de la rue comme il le faisait toujours, au moment où on en avait le plus besoin.",
  "Et puis, l'un des deux garçons m'a rattrapée, a posé une main sur mon épaule pour me faire ralentir, et j'ai senti — je ne sais pas comment le décrire autrement — un froid qui n'avait rien à voir avec la température de la soirée, une masse invisible qui semblait s'être installée entre eux et moi d'un coup, une pression presque physique dans l'air. Le garçon a retiré sa main aussi vite qu'il l'avait posée, le visage soudain livide, et il a reculé en bafouillant quelque chose que je n'ai pas compris, avant d'entraîner l'autre avec lui. Ils ont disparu au coin de la rue en courant, sans jamais se retourner."]});
shot({bg:()=>sceneTitleIceberg(true),
 extra:`<g class="ghost" style="--gd:1s">${A('yoann',{x:690,y:660,s:1.15,pal:GHOSTPAL,expr:'cold',anim:'idle'})}</g>`+`<g class="txt" style="--d:20s">${TX(640,130,'FIN',60,'#cfeaff','font-weight="700" letter-spacing="14"')}</g>`,
 beats:["Je suis restée seule sur le trottoir, le cœur battant à tout rompre, incapable de bouger pendant plusieurs minutes. Et c'est là, en reprenant enfin mon souffle, que j'ai senti quelque chose que je ne peux expliquer à personne sans avoir l'air d'inventer : une odeur, familière, précise, celle du parfum qu'il utilisait, celle que je reconnaîtrais entre mille, portée par un vent qui n'existait pas une seconde plus tôt et qui a disparu presque aussi vite qu'il était venu.",
  "Je ne raconte pas cette histoire pour qu'on me croie. Je la raconte parce que, depuis ce soir-là, je ne marche plus jamais tout à fait seule. Et parce que Yoann, un jour, m'avait dit qu'il pourrait faire énormément de choses pour moi.",
  "Je crois, maintenant, qu'il n'a jamais vraiment arrêté."]});

 const d=c.createDelay(1);d.delayTime.value=.38;const fb=c.createGain();fb.gain.value=.4;const wet=c.createGain();wet.gain.value=.4;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;

 const sub=c.createOscillator();sub.type='sine';sub.frequency.value=55;const sg=c.createGain();sg.gain.value=0;sub.connect(sg);sg.connect(AU.m);sub.start();AU.sub=sg;
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;AU.nb=nb;

}
function setMood(m){if(!AU.c||AU.mood===m)return;AU.mood=m;const ch=MOODS[m]||MOODS.calm,tm=AU.c.currentTime;AU.pad.forEach((o,i)=>o.frequency.setTargetAtTime(ch[i],tm,1.6));AU.sub.gain.setTargetAtTime(m==='tense'||m==='cold'?.1:0,tm,1.5)}
function note(f,v,du){const c=AU.c,o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.0005,n+du);o.connect(g);g.connect(AU.m);g.connect(AU.fx);o.start();o.stop(n+du+.1)}

function sfx(n){if(!AU.c||!sound||AU.c.state!=='running')return;
 if(n==='thump')kick(150,45,.22,.9);

function pickVoice(){const v=speechSynthesis.getVoices();frVoice=v.find(x=>/^fr/i.test(x.lang)&&/natural|online|google/i.test(x.name))||v.find(x=>/^fr/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(txt){if(!voice||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/[«»]/g,''));u.lang='fr-FR';if(frVoice)u.voice=frVoice;u.rate=Math.min(4,1.18*speed);speechSynthesis.speak(u)}
function applySpeed(){sceneG.getAnimations({subtree:true}).forEach(a=>a.playbackRate=speed)}
function trans(kind,out){
 if(!trEl)return;const w=kind==='flash'?'#fff':'#000';trEl.setAttribute('fill',w);
 const fr=kind==='wipe'?(out?[{transform:'translateX(-1280px)',opacity:1},{transform:'translateX(0)',opacity:1}]:[{transform:'translateX(0)',opacity:1},{transform:'translateX(1280px)',opacity:1}]):(out?[{opacity:0},{opacity:1}]:[{opacity:1},{opacity:0}]);
 trEl.getAnimations().forEach(a=>a.cancel());trEl.animate(fr,{duration:kind==='flash'?450:out?600:800,fill:'forwards',easing:'ease-in-out'})}
function title(s){
 bigEl.classList.remove('go');const b=bigEl.querySelector('b'),sm=bigEl.querySelector('small');
 if(!s.big)return;sm.textContent=s.ch;b.innerHTML=[...s.title].map((ch,i)=>`<span style="animation-delay:${(.25+i*.05).toFixed(2)}s">${ch===' '?'&nbsp;':ch}</span>`).join('');void bigEl.offsetWidth;bigEl.classList.add('go')}
function load(i){
 if(i<0)i=0;if(i>=S.length){finish();return}
 idx=i;t=0;curLine=-1;fi=0;outDone=false;const s=S[i];
 sceneG.innerHTML=s.svg(s.D);applySpeed();
 chapEl.textContent=s.ch+' — '+s.title;capEl.classList.remove('on');
 if('speechSynthesis' in window)speechSynthesis.cancel();
 title(s);trans(s.tr,false);if(AU.c)setMood(s.mood);
 [...bar.children].forEach((el,j)=>{el.classList.toggle('done',j<s.ci);el.firstChild.style.transform=j===s.ci?'scaleX('+(s.pre/CHS[j].D)+')':''});
}
function finish(){playing=false;setPlay();idx=S.length-1;t=S[idx].D}
function setPlay(){$('bPlay').textContent=playing?'⏸':'▶';$('stage').classList.toggle('paused',!playing);if(AU.c)playing?AU.c.resume():AU.c.suspend()}
function showLine(){
 const s=S[idx];let n=-1;
 for(let j=0;j<s.T.length;j++)if(t>=s.T[j].s&&t<s.T[j].e){n=j;break}
 if(n!==curLine){curLine=n;
  if(n<0||s.T[n].dlg){capEl.classList.remove('on');words=[];if(n>=0)speak(s.T[n].l)}
  else{const l=s.T[n].l;capS.innerHTML=l.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ');words=[...capS.children];wS=s.T[n].s;wE=s.T[n].e;capEl.classList.add('on');speak(l)}
 }
 if(words.length){const p=Math.min(1,Math.max(0,(t-wS)/Math.max(.5,(wE-wS-.5))));const k=Math.ceil(p*words.length);words.forEach((w,j)=>w.classList.toggle('lit',j<k))}
}
function frame(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;
 if(playing&&idx>=0){
  t+=dt*speed;showLine();const s=S[idx];
  while(fi<s.fx.length&&s.fx[fi][0]<=t){sfx(s.fx[fi][1]);fi++}
  if(!outDone&&t>s.D-.7){outDone=true;trans(s.tr==='flash'?'flash':'fade',true)}
  const f=bar.children[s.ci];if(f)f.firstChild.style.transform='scaleX('+Math.min(1,(s.pre+Math.min(t,s.D))/CHS[s.ci].D)+')';
  if(t>=s.D)load(idx+1);
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(n=>{last=n;frame(n)});
$('bGo').onclick=()=>{$('start').style.display='none';started=true;auInit();playing=true;load(0);setPlay()};
$('bPlay').onclick=()=>{if(!started)return;if(idx>=S.length-1&&t>=S[idx].D)load(0);playing=!playing;setPlay();if('speechSynthesis' in window)playing?speechSynthesis.resume():speechSynthesis.pause()};
$('bPrev').onclick=()=>{if(started)load(t>3?idx:idx-1)};
$('bNext').onclick=()=>{if(started)load(idx+1)};
$('bVoice').onclick=e=>{voice=!voice;e.target.classList.toggle('on',voice);if(!voice&&'speechSynthesis' in window)speechSynthesis.cancel();else curLine=-1};
$('bMusic').onclick=e=>{sound=!sound;e.target.classList.toggle('on',sound);if(AU.m)AU.m.gain.value=sound?.55:0};
$('bMusic').classList.add('on');
$('bSpeed').onclick=e=>{speed=speed===1?1.5:speed===1.5?2:speed===2?4:1;e.target.textContent='×'+speed;applySpeed();if(voice)curLine=-1};
$('bCC').onclick=e=>{const on=capEl.classList.toggle('hide');e.currentTarget.classList.toggle('on',!on)};
$('bFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():$('frame').requestFullscreen()};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('bPlay').click()}else if(e.code==='ArrowRight')$('bNext').click();else if(e.code==='ArrowLeft')$('bPrev').click();else if(e.key==='f'||e.key==='F')$('bFull').click();else if(e.key==='c'||e.key==='C')$('bCC').click()});
window.seek=(i,sec)=>{$('start').style.display='none';started=true;load(i);t=sec;playing=false;$('stage').classList.add('paused');curLine=-1;showLine();
 sceneG.getAnimations({subtree:true}).forEach(a=>{try{a.pause();a.currentTime=sec*1000/(1)}catch(e){}});};
window.SCENES=S;

</script>
</body>
