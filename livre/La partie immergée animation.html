<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La partie immergée</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050608;color:#eee;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#frame{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#000;overflow:hidden}
svg#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
svg text{font-family:system-ui,'Segoe UI',sans-serif}
#cap{position:absolute;left:6%;right:6%;bottom:7%;text-align:center;font-size:clamp(12px,1.75vw,24px);line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none}
#cap.on{opacity:1}
#cap.hide{display:none}
#cap.q{font-style:italic}
#cap span{background:rgba(0,0,0,.62);padding:.12em .55em;border-radius:.4em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#chap{position:absolute;left:3%;top:4%;font:600 clamp(10px,1.2vw,15px)/1.3 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.8;text-shadow:0 1px 6px #000;pointer-events:none}
#big{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0}
#big.go{animation:bigA 3.2s ease both}
@keyframes bigA{0%{opacity:0}18%{opacity:1}75%{opacity:1}100%{opacity:0}}
#big small{display:block;font:600 clamp(11px,1.5vw,18px) system-ui,sans-serif;letter-spacing:.35em;text-transform:uppercase;opacity:.8;margin-bottom:.6em}
#big>div{padding:1.1em 2.6em 1.3em;border-radius:1.4em;background:radial-gradient(ellipse at center,rgba(4,8,16,.88) 0,rgba(4,8,16,.78) 55%,rgba(4,8,16,0) 100%);color:#fff}
#big b{font-size:clamp(24px,5vw,64px);font-weight:400;text-shadow:0 2px 20px #000}
#ui{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 12px;display:flex;gap:8px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity .3s;font-family:system-ui,sans-serif;z-index:5}
#frame:hover #ui{opacity:1}
#ui button{background:#ffffff18;border:1px solid #ffffff33;color:#fff;border-radius:8px;padding:6px 11px;font-size:14px;cursor:pointer}
#ui button:hover{background:#ffffff33}
#ui button.on{background:#4ad8ff44;border-color:#4ad8ff}
#bar{flex:1;display:flex;gap:3px;height:14px;align-items:center}
#bar i{flex:1;height:6px;background:#ffffff30;border-radius:3px;cursor:pointer;position:relative;overflow:hidden}
#bar i:hover{height:10px}
#bar i b{position:absolute;inset:0;background:#4ad8ff;transform-origin:left;transform:scaleX(0)}
#bar i.done b{transform:scaleX(1)}
#start{position:absolute;inset:0;z-index:9;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 60%,#14354d,#04080e 70%)}
#start h1{font-weight:400;font-size:clamp(28px,6vw,76px);margin:0 0 .2em;letter-spacing:.04em}
#start p{margin:0 0 1.6em;opacity:.75;font-size:clamp(13px,1.6vw,20px)}
#start button{font:600 clamp(14px,1.6vw,20px) system-ui,sans-serif;background:#4ad8ff;color:#04202e;border:0;border-radius:999px;padding:.8em 2em;cursor:pointer}
#start small{display:block;margin-top:1.2em;opacity:.5;font:12px system-ui,sans-serif}

/* ---------- animations ---------- */
.paused *{animation-play-state:paused!important}
.ph,.bub{opacity:0;animation:phase var(--u) var(--d) both}
@keyframes phase{0%{opacity:0}5%{opacity:1}95%{opacity:1}100%{opacity:0}}
.bub{transform-box:fill-box}
.ent-L{animation:inL .9s var(--ed,0s) both ease-out}
.ent-R{animation:inR .9s var(--ed,0s) both ease-out}
.ent-F{animation:fade 1s var(--ed,0s) both}
@keyframes inL{from{transform:translateX(-460px);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(460px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.trav{animation:trav var(--tu,2s) var(--td,0s) linear both}
@keyframes trav{to{transform:translateX(var(--dx))}}
.fallw{transform-box:fill-box;transform-origin:50% 100%;animation:fl .55s var(--fd,0s) both ease-in}
@keyframes fl{to{transform:rotate(-88deg) translateY(8px)}}
.recoil{animation:rc .5s var(--rd,0s) both ease-out}
@keyframes rc{to{transform:translateX(var(--rx,40px))}}

.body{transform-box:fill-box;transform-origin:50% 100%}
.legL,.legR,.armL,.armR{transform-box:fill-box;transform-origin:50% 0}
.idle{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-3px)}}
.walk{animation:bob .5s ease-in-out var(--it,infinite)}
@keyframes bob{50%{transform:translateY(-6px)}}
.walk .legL{animation:sw .5s ease-in-out var(--it,infinite) alternate}
.walk .legR{animation:sw .5s ease-in-out var(--it,infinite) alternate-reverse}
.walk .armL{animation:sw2 .5s ease-in-out var(--it,infinite) alternate}
.walk .armR{animation:sw2 .5s ease-in-out var(--it,infinite) alternate-reverse}
@keyframes sw{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes sw2{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.run{animation:runb .28s ease-in-out var(--it,infinite);transform:rotate(9deg)}
@keyframes runb{50%{transform:rotate(9deg) translateY(-14px)}0%,100%{transform:rotate(9deg)}}
.run .legL{animation:swr .28s ease-in-out var(--it,infinite) alternate}
.run .legR{animation:swr .28s ease-in-out var(--it,infinite) alternate-reverse}
.run .armL{animation:swr .28s ease-in-out var(--it,infinite) alternate-reverse}
.run .armR{animation:swr .28s ease-in-out var(--it,infinite) alternate}
@keyframes swr{from{transform:rotate(-48deg)}to{transform:rotate(48deg)}}
.jump{animation:jmp .95s ease-in-out infinite}
@keyframes jmp{0%,100%{transform:translateY(0)}50%{transform:translateY(-190px)}}
.jump .armL{animation:upL .95s ease-in-out infinite}
.jump .armR{animation:upR .95s ease-in-out infinite}
@keyframes upL{50%{transform:rotate(-150deg)}}
@keyframes upR{50%{transform:rotate(150deg)}}
.flip{animation:flp 1.5s ease-in-out infinite;transform-origin:50% 50%}
@keyframes flp{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-175px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
.shake{animation:shk .1s linear infinite}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.laugh{animation:lau .32s ease-in-out infinite alternate}
@keyframes lau{to{transform:translateY(-9px)}}
.wave .armR{animation:wv .45s ease-in-out infinite alternate;transform:rotate(-150deg)}
@keyframes wv{from{transform:rotate(-140deg)}to{transform:rotate(-175deg)}}
.punch .armR{animation:pn .3s var(--pd,0s) both ease-in}
@keyframes pn{to{transform:rotate(-92deg)}}
.beg .armR{transform:rotate(-72deg)}
.hug .armL{transform:rotate(60deg)}
.hug .armR{transform:rotate(-60deg)}
.press .armL,.press .armR{transform:rotate(-30deg)}
.hands .armL{transform:rotate(25deg)}
.hands .armR{transform:rotate(-25deg)}
.kneel{transform:translateY(70px) scaleY(.82)}
.cower{transform:scale(.88) translateY(8px)}
.shrink{animation:shr 3s 1s both ease-in-out}
@keyframes shr{to{transform:scale(.86) translateY(10px)}}
.tear{animation:tr .9s infinite}
@keyframes tr{from{transform:translateY(0);opacity:1}to{transform:translateY(34px);opacity:0}}
.eyes{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
@keyframes bl{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.scroll{animation:scr var(--sp,4s) linear infinite}
@keyframes scr{to{transform:translateX(-1280px)}}
.ghost{opacity:0;animation:gh 1.6s var(--gd,0s) both;filter:drop-shadow(0 0 16px #4ad8ff)}
@keyframes gh{to{opacity:.55}}
.flk{animation:flk 1.4s infinite}
@keyframes flk{0%,18%,22%,60%,100%{opacity:1}20%,25%,62%{opacity:.12}}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:rg .8s var(--d,0s) both ease-out}
@keyframes rg{from{transform:scale(.2);opacity:1}to{transform:scale(3.2);opacity:0}}
.tint{opacity:0;animation:tn var(--u,1.5s) var(--d,0s) both}
@keyframes tn{to{opacity:var(--o,.5)}}
.txt{opacity:0;animation:fade 1.2s var(--d,0s) both}
.spd{animation:spd .35s linear infinite}
@keyframes spd{to{transform:translateX(-320px)}}
.fly{opacity:0;animation:fy 2.4s var(--d,0s) infinite}
@keyframes fy{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--fx,360px),-50px);opacity:0}}
.pulse{animation:pls 1.1s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.07)}}
.pulse,.clk{transform-box:fill-box;transform-origin:center}
.clk{animation:rng .12s linear infinite}
@keyframes rng{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.train{animation:trn 3.2s var(--d,0s) linear both}
@keyframes trn{from{transform:translateX(-1500px)}to{transform:translateX(1400px)}}
.wv{animation:wavy 3s ease-in-out infinite alternate}
@keyframes wavy{to{transform:translateX(-30px)}}
.drift{animation:drf 6s ease-in-out infinite alternate}
@keyframes drf{to{transform:translateY(10px)}}
.glow{animation:glw 2.4s ease-in-out infinite alternate}
@keyframes glw{from{opacity:.3}to{opacity:.9}}

.cam{transform-origin:var(--co,640px 400px);animation:camA var(--cd) cubic-bezier(.45,0,.55,1) both}
@keyframes camA{from{transform:translate(var(--x0),var(--y0)) scale(var(--z0))}to{transform:translate(var(--x1),var(--y1)) scale(var(--z1))}}
.seg0{animation:s0 var(--u) 0s both}
@keyframes s0{0%,97%{opacity:1}100%{opacity:0}}
.segM{opacity:0;animation:sM var(--u) var(--d) both}
@keyframes sM{0%{opacity:0}1%,97%{opacity:1}100%{opacity:0}}
.segE{opacity:0;animation:sE .05s var(--d) both}
@keyframes sE{to{opacity:1}}
.mth{transform-box:fill-box;transform-origin:center;animation:mth .2s ease-in-out infinite alternate}
@keyframes mth{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.mote{animation:mote var(--md) linear var(--mdl) infinite;opacity:0}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.7}85%{opacity:.5}100%{opacity:0;transform:translate(var(--mx),-220px)}}
.squat{animation:sqt 1.3s ease-in-out infinite}
@keyframes sqt{50%{transform:translateY(34px) scaleY(.9)}}
.squat .armL{animation:uL 1.3s ease-in-out infinite}
.squat .armR{animation:uR 1.3s ease-in-out infinite}
@keyframes uL{50%{transform:rotate(-80deg)}}
@keyframes uR{50%{transform:rotate(80deg)}}
.flip{animation:flp 1.5s cubic-bezier(.3,.1,.3,1) infinite;transform-origin:50% 50%}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:drw var(--du,1.5s) var(--d,0s) forwards ease-out}
@keyframes drw{to{stroke-dashoffset:0}}
.card{opacity:0;animation:cardIn .9s var(--d) both cubic-bezier(.2,.9,.3,1.15)}
@keyframes cardIn{from{opacity:0;transform:translate(140px,50px) rotate(14deg) scale(.7)}to{opacity:1;transform:rotate(var(--r,0deg))}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:popA .6s var(--d) both cubic-bezier(.2,1.4,.4,1)}
@keyframes popA{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.beam{animation:bm 5s ease-in-out infinite alternate}
@keyframes bm{from{opacity:.45}to{opacity:1}}
.contract{opacity:0;transform-box:fill-box;transform-origin:center;animation:ctr 3.2s var(--d) both ease-in}
@keyframes ctr{0%{opacity:0;transform:scale(2.6)}20%{opacity:.9}100%{opacity:.9;transform:scale(.3)}}
.typ{transform-box:fill-box;transform-origin:left;animation:typ 3s var(--d) steps(14) infinite}
@keyframes typ{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.w{opacity:.32;transition:opacity .25s}
.w.lit{opacity:1}
#big b span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(24px) scale(1.15);animation:ltr .8s forwards cubic-bezier(.2,.8,.2,1)}
@keyframes ltr{to{opacity:1;filter:blur(0);transform:none}}
#big b::after{content:'';display:block;height:2px;margin:.4em auto 0;background:#8fe3ff;width:0;animation:ul 1.4s .8s forwards ease-out}
@keyframes ul{to{width:60%}}
</style>
</head>
<body>
<div id="wrap">
 <div id="frame">
  <svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
   <defs>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9f7"/><stop offset=".4" stop-color="#86bddf"/><stop offset=".41" stop-color="#1d6394"/><stop offset="1" stop-color="#030d1a"/></linearGradient>
    <linearGradient id="seaN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a2d"/><stop offset=".4" stop-color="#16314d"/><stop offset=".41" stop-color="#0d3556"/><stop offset="1" stop-color="#02060c"/></linearGradient>
    <linearGradient id="berg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6f1ff" stop-opacity=".75"/><stop offset="1" stop-color="#2a79ad" stop-opacity=".2"/></linearGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
    <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa8d6"/><stop offset="1" stop-color="#cfe6f5"/></linearGradient>
    <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#1c2438"/></linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".85"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7fdcff" stop-opacity=".8"/><stop offset="1" stop-color="#7fdcff" stop-opacity="0"/></radialGradient>
   </defs>
   <g id="scene"></g>
   <rect width="1280" height="720" fill="url(#vig)" pointer-events="none"/><rect id="tr" width="1280" height="720" fill="#000" opacity="0" pointer-events="none"/>
  </svg>
  <div id="chap"></div>
  <div id="big"><div><small></small><b></b></div></div>
  <div id="cap"><span></span></div>
  <div id="ui">
   <button id="bPrev" title="Scène précédente">⏮</button>
   <button id="bPlay" title="Lecture / pause (espace)">⏸</button>
   <button id="bNext" title="Scène suivante">⏭</button>
   <div id="bar"></div>
   <button id="bSpeed" title="Vitesse de lecture (image, voix et sons)">×1</button>
   <button id="bMusic" title="Musique et bruitages">🎵 Son</button>
   <button id="bVoice" title="Voix off (navigateur)">🔊 Voix</button>
   <button id="bCC" class="on" title="Sous-titres (C)">💬 Sous-titres</button>
   <button id="bFull" title="Plein écran (F)">⛶</button>
  </div>
  <div id="start">
   <div>
    <h1>La partie immergée</h1><p style="opacity:.9;margin-bottom:.4em">Roman animé en 17 chapitres</p>
    <p>Espace : pause · ←/→ : plan · C : sous-titres · F : plein écran</p>
    <button id="bGo">▶ Lancer l'animation</button>
    <small>Espace : pause · ← → : changer de scène · F : plein écran</small>
   </div>
  </div>
 </div>
</div>

<script>
/* =====================================================================
   PERSONNAGES  (couleurs / coiffures inventées d'après les fiches)
   ===================================================================== */
const CH={
 yoann:{skin:'#e6bf9c',hair:'#2b211c',hs:'short',top:'#16171b',pants:'#101115',shoe:'#e9e9e9',coat:'#3b4048',h:1},
 lohane:{skin:'#efcdb0',hair:'#7b4a2c',hs:'long',top:'#e2a93a',pants:'#3d5b88',shoe:'#f3f3f3',h:.9},
 johann:{skin:'#f1d0b3',hair:'#c7a15a',hs:'messy',top:'#4f7b5c',pants:'#2e3441',shoe:'#222',h:.95},
 dylan:{skin:'#e4bd9a',hair:'#1c1b23',hs:'wavy',top:'#b2473f',pants:'#2f3b52',shoe:'#eee',h:.93},
 mere:{skin:'#efc8a5',hair:'#8b3c2b',hs:'bob',top:'#7b4c75',pants:'#2a2a33',shoe:'#333',h:.88},
 pere:{skin:'#e2b692',hair:'#5a493b',hs:'short',top:'#4b6ea6',pants:'#3a3a3a',shoe:'#555',h:1},
 sarah:{skin:'#f2d1ba',hair:'#16161b',hs:'long',top:'#d9698d',pants:'#222',shoe:'#fff',h:.9},
 manon:{skin:'#f0cdb2',hair:'#b4552f',hs:'bob',top:'#6c8ebf',pants:'#333',shoe:'#fff',h:.88},
 lucas:{skin:'#e8c4a4',hair:'#4a3a2e',hs:'short',top:'#8a8f98',pants:'#3a4252',shoe:'#fff',h:1.06},
 thug:{skin:'#c99a76',hair:'#111',hs:'hood',top:'#25262b',pants:'#1a1b1f',shoe:'#444',h:1},
};
const GHOSTPAL={skin:'#07131f',hair:'#07131f',top:'#07131f',pants:'#07131f',shoe:'#07131f',coat:'#07131f'};
const SILPAL={skin:'#050608',hair:'#050608',top:'#050608',pants:'#050608',shoe:'#050608',coat:'#050608'};

function A(k,o={}){
 const c={...CH[k],...(o.pal||{})};
 const s=(o.s||1)*c.h, x=o.x??640, y=o.y??640, an=o.anim||'idle';
 const coat=o.coat===undefined?(k==='yoann'):o.coat;
 const sl=coat?c.coat:c.top, ex=o.expr||'neutral', hood=c.hs==='hood';
 let b='';
 b+=`<g class="legL"><rect x="-28" y="-142" width="25" height="142" rx="11" fill="${c.pants}"/><rect x="-12" y="-140" width="9" height="136" rx="4" fill="#000" opacity=".16"/><ellipse cx="-17" cy="-3" rx="21" ry="9" fill="${c.shoe}" stroke="#00000040" stroke-width="2"/><ellipse cx="-17" cy="3" rx="21" ry="4" fill="#000" opacity=".3"/></g>`;
 b+=`<g class="legR"><rect x="3" y="-142" width="25" height="142" rx="11" fill="${c.pants}"/><rect x="19" y="-140" width="9" height="136" rx="4" fill="#000" opacity=".16"/><ellipse cx="17" cy="-3" rx="21" ry="9" fill="${c.shoe}" stroke="#00000040" stroke-width="2"/><ellipse cx="17" cy="3" rx="21" ry="4" fill="#000" opacity=".3"/></g>`;
 const shade=(x,w,h,y)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w/2}" fill="#000" opacity=".16"/><rect x="${-x-w}" y="${y+8}" width="${w*.35}" height="${h*.7}" rx="4" fill="#fff" opacity=".08"/>`;
 b+=`<rect x="-44" y="-248" width="88" height="128" rx="28" fill="${c.top}" stroke="#00000030" stroke-width="2"/>`+shade(14,30,124,-246);
 if(coat)b+=`<rect x="-49" y="-252" width="98" height="146" rx="26" fill="${c.coat}" stroke="#00000040" stroke-width="2"/><rect x="-6" y="-248" width="12" height="136" fill="${c.top}"/>`+shade(18,31,140,-250)+`<path d="M-6,-248 L-26,-222 L-6,-214Z M6,-248 L26,-222 L6,-214Z" fill="#00000030"/>`;
 b+=`<g class="armL"><rect x="-66" y="-238" width="21" height="120" rx="10" fill="${sl}"/><circle cx="-55" cy="-116" r="10" fill="${c.skin}"/></g>`;
 let armR=`<rect x="45" y="-238" width="21" height="120" rx="10" fill="${sl}"/><circle cx="56" cy="-116" r="10" fill="${c.skin}"/>`;
 if(o.phone)armR+=`<rect x="46" y="-136" width="18" height="32" rx="3" fill="#111" stroke="#8fe3ff" stroke-width="2"/>`;
 if(o.knife)armR+=`<path d="M58,-120 L102,-160" stroke="#d7dde6" stroke-width="6" stroke-linecap="round"/>`;
 b+=`<g class="armR">${armR}</g>`;
 b+=`<rect x="-10" y="-272" width="20" height="30" fill="${c.skin}"/>`;
 if(o.marks)b+=`<rect x="-16" y="-262" width="12" height="6" rx="3" fill="#8e3f66"/><rect x="2" y="-258" width="14" height="6" rx="3" fill="#a34a5e"/><rect x="-6" y="-250" width="12" height="5" rx="2" fill="#7a3a7a"/>`;
 if(c.hs==='long')b+=`<path d="M-41,-300 Q-50,-226 -32,-208 L32,-208 Q50,-226 41,-300Z" fill="${c.hair}"/>`;
 if(hood){
  b+=`<ellipse cx="0" cy="-298" rx="46" ry="48" fill="${c.top}"/><ellipse cx="0" cy="-292" rx="29" ry="31" fill="#0b0b0e"/>`;

  "Ça a suffi à répondre pour moi. Depuis, ça fait deux mois."]});

chap('Chapitre 3','Un lundi comme les autres');
shot({bg:()=>clockSvg(),beats:["Le réveil sonne à six heures et demie, toujours à la même minute, comme s'il n'existait pas d'autre heure possible pour commencer une journée.","Je l'éteins avant la deuxième sonnerie, presque par réflexe, et je reste une seconde allongé dans le noir, à écouter les premiers bruits de l'immeuble qui se réveille. La douche, ensuite, chaude puis un peu moins chaude vers la fin, histoire de finir de me réveiller pour de bon."]});
shot({bg:'cuisine',table:[420,900,470,'#a9825a','#8c6a47'],
 cast:{y:yh(520,{phone:1,s:.98}),m:P('mere',1000,{enter:'R',delay:8,expr:'open',pal:{top:'#b9a7c9'}})},
 extra:R(500,430,60,40,'#d9a35a','rx="10"')+R(590,430,60,40,'#d9a35a','rx="10"')+R(700,400,36,70,'#fff')+R(770,410,34,60,'#f08a1d'),
 beats:["Dans la cuisine, c'est invariablement pareil : des muffins, du lait, un jus de fruits, posés toujours au même endroit sur la table, comme si l'ordre lui-même avait une importance. Je ne me souviens même plus si j'ai un jour choisi ce petit-déjeuner.",
  "Je prépare mon sac en mangeant, machinalement : la trousse, le chargeur, le cahier qu'il ne faut surtout pas oublier. Sur mon téléphone, quelques messages — Johann, Dylan, parfois Lohane — et je réponds entre deux bouchées, juste assez pour dire que la journée commence.",
  "C'est à ce moment-là que ma mère entre dans la cuisine, encore en pyjama, une tasse à la main, et que les questions arrivent, une par-dessus l'autre.",
  ['m',"Où tu vas après les cours ? Tu as pensé à prendre telle affaire ?"],
  ['m',"Pourquoi tu es encore sur ton téléphone à cette heure-ci ?"],
  "Ce n'est jamais une vraie conversation, plutôt une rafale à laquelle je ne suis même pas censé répondre, et je sens monter cette irritation nette qui colore tout le reste de la matinée. Je sors de l'appartement un peu plus vite que nécessaire, la porte qui claque un peu plus fort que nécessaire aussi, sans un vrai au revoir."]});
shot({bg:'rueJs',cast:{y:P('yoann',640,{anim:'walk',it:999,expr:'neutral'})},
 beats:["Dehors, le trajet jusqu'au lycée ne varie jamais. Le même restaurant fermé le matin, rideau baissé, avec ce carton publicitaire délavé collé à la vitrine. Le même kiosque à journaux, avec toujours plus ou moins les mêmes couvertures. Ce chantier qui traîne depuis des années, entouré des mêmes barrières rouillées. La même sortie de métro, ce flot de gens qui montent et descendent aux mêmes heures que moi, sans qu'on se regarde jamais vraiment."]});
shot({bg:'lycee',cast:{j:P('johann',640,{expr:'smile',phone:1}),y:P('yoann',160,{anim:'walk',go:[0,400,5]})},
 beats:["Et puis le lycée, enfin, avec Johann qui m'attend déjà devant, adossé au mur, le téléphone à la main, comme chaque matin."]});
shot({bg:'classe',table:[300,1000,500],
 cast:{y:P('yoann',420,{coat:false,expr:'neutral'}),l:P('lohane',620,{enter:'R',delay:6,expr:'laugh'}),a:kd('lucas',860,'#d0583c',{anim:'idle',expr:'smile'})},
 beats:["En classe, tout est à sa place. La même rangée, les visages habituels, et à côté de moi une chaise vide — celle de Lohane, qui n'est encore jamais à l'heure. Je lui écris pour savoir où elle en est, elle me répond en deux mots qu'elle arrive, et la sonnerie retentit avant que j'aie rangé mon téléphone.",
  "Elle se glisse sur sa chaise à peine une minute après, essoufflée, comme toujours, dans cette marge étroite entre juste à temps et vraiment en retard.",
  "Pendant les cours, il y a toujours un moment où quelqu'un se penche vers moi, à voix basse.",
  ['a',"T'as compris cet exercice ? Tu peux m'aider ? Non en fait donne-moi juste la réponse."],
  "Je m'exécute, la plupart du temps, presque sans y penser, parce que refuser demanderait une discussion que je n'ai pas envie d'avoir, un conflit minuscule mais qui coûterait plus cher que le service lui-même."]});
shot({bg:'lycee',cast:{l:P('lohane',460,{expr:'laugh',anim:'laugh'}),y:P('yoann',640,{expr:'smile'}),j:P('johann',820,{expr:'smile'})},
 beats:["La matinée s'égrène sans surprise : une heure de cours, une autre, puis la récréation, où je retrouve Johann et Lohane quelques minutes avant que tout reparte, adossés à la même rambarde qu'on occupe depuis des mois sans s'être jamais posé la question de pourquoi."]});
shot({bg:'cantine',table:[90,1190,500,'#b9b9b9','#9a9a9a'],
 cast:{y:P('yoann',420,{coat:false,expr:'neutral'}),j:P('johann',560,{expr:'smile'}),a:kd('lucas',760,'#d0583c',{anim:'idle'}),b:kd('manon',900,'#c6a23a',{anim:'idle'}),c:kd('dylan',1040,'#3b8a6a',{anim:'idle'})},
 beats:["Deux heures de cours suivent encore, et enfin la cantine. Lohane rentre chez elle à midi — alors je mange avec Johann et le reste du groupe, sept ou huit selon les jours, dans ce brouhaha de plateaux et de conversations qui se croisent sans jamais vraiment s'écouter.",
  "C'est souvent à ce moment-là, entre deux bouchées, que quelqu'un se souvient soudain qu'il a un exercice à rendre, ou un site à créer pour un projet, et que mon nom lui revient en tête.",
  ['a',"Yoann, tu pourrais m'aider ce soir ?"],
  "La formule change un peu d'une fois à l'autre, mais l'intention reste identique. Je réponds que oui, sans réfléchir, parce que dire non demanderait plus d'énergie que je n'en ai envie de dépenser sur ce sujet-là."]});
shot({bg:'gym',cast:{y:P('yoann',640,{y:590,coat:false,anim:'flip',expr:'smile'})},
 beats:["L'après-midi ressemble en tout point à la matinée. À seize heures, la sonnerie libère tout le monde d'un coup, et je rentre avec Lohane jusqu'à ce que nos chemins se séparent : elle vers chez elle, moi vers le trampoline.",
  "C'est le seul moment de la journée où je ne pense à rien d'autre qu'au mouvement lui-même. Le corps qui se propulse, qui retombe, qui recommence, cette sensation de vide dans l'estomac au sommet de chaque saut, cette seconde de suspension où plus rien d'autre n'existe. Pas de messages, pas de questions, juste l'effort et la concentration. Ça dure ce que ça dure, et puis il faut rentrer."]});
shot({bg:'chambre',cast:{y:yh(780,{anim:'idle',expr:'neutral'})},
 beats:["Je suis chez moi vers dix-huit heures, fatigué d'une fatigue qui n'est pas seulement physique. Ma mère m'accueille avec une ou deux questions de plus, que j'écoute à moitié en filant vers ma chambre.",
  "Je m'installe pour travailler, les devoirs, les révisions, la porte à moitié fermée derrière moi. Et c'est souvent là, une fois le silence installé, que les messages recommencent à tomber.",
  ['@300,380',"T'as fait l'exercice de maths ? Tu peux m'envoyer ?",'msg2'],
  "C'est à peu près le seul moment où ils m'écrivent le soir, ceux-là. Jamais pour demander comment s'est passée ma journée, ou si ça va.",
  "Une fois le travail terminé, j'allume mon ordinateur, moins pour avancer quoi que ce soit que pour me vider la tête : une vidéo, un épisode d'anime, quelque chose qui ne demande rien de moi."]});
shot({bg:'salon',table:[380,900,480,'#9c7a52','#7d5f3d'],cast:{m:P('mere',480,{expr:'neutral'}),y:yh(800,{expr:'neutral'})},
 beats:["Le repas avec ma mère arrive ensuite, et c'est là que ça recommence, autrement. Pas les questions en rafale du matin, pas cette irritation nette qu'on identifie tout de suite. Plutôt un silence qui s'étire un peu trop longtemps, une remarque anodine en apparence mais qui trouve sans mal l'endroit exact où appuyer. Je ne dis pas grand-chose. Je laisse passer.",
  "Vers vingt et une heures, elle se lève de table pour aller à sa soirée, maquillage refait, manteau attrapé au passage, et l'appartement redevient silencieux d'un coup. Je finis de manger seul, je fais la vaisselle, et je retourne dans ma chambre."]});
shot({bg:'chambre',cast:{y:yh(780,{expr:'neutral',phone:1})},tint:['#000',.35,2],
 beats:["Elle rentre vers vingt-trois heures, je l'entends vaguement se coucher, la porte de sa chambre qui se ferme doucement. Moi, je reste éveillé — au téléphone avec Dylan, ou en messages avec Lohane, à parler de tout et de rien jusqu'à ce que la conversation s'essouffle d'elle-même, vers minuit.",
  "Après ça, je reste seul devant mon ordinateur, sans raison précise, parfois jusqu'à quatre heures du matin, dans cette bulle silencieuse où plus rien ne peut vraiment m'atteindre. Et puis je finis par dormir, quelques heures à peine, avant que le réveil ne sonne de nouveau à six heures et demie. Et tout recommence."]});

/* ================= CHAPITRE 4 ================= */
chap('Chapitre 4','Le mur');
shot({bg:'salon',table:[330,860,480],tint:['#5a0f10',.3,4,25],
 cast:{m:P('mere',380,{expr:'neutral'}),y:yh(800,{expr:'neutral'})},
 beats:["La semaine s'était resserrée sur elle-même, jour après jour. Rien de tout ça, pris séparément, n'aurait suffi : les questions du matin, les remarques du soir qui trouvaient chaque fois un peu mieux leur cible, ce sentiment d'être surveillé jusque dans les détails les plus insignifiants. Mais ce vendredi soir, en rentrant du trampoline, la nuit déjà tombée, je sentais que quelque chose s'était tassé en moi, prêt à céder au moindre prétexte. Je le sentais dans mes épaules, dans cette tension qui ne voulait pas se relâcher même sous la douche.",
  "Le repas a commencé comme toujours, dans le salon, la télévision éteinte, seulement le bruit des couverts contre les assiettes.",
  ['m',"Tu as pensé à regarder pour ton stage ?"],['y',"Pas encore. J'ai eu pas mal de trucs cette semaine."],['m',"C'est toujours pareil avec toi. Tu remets, tu remets."],['y',"J'ai dit que je m'en occupais."],
  "Elle a reposé sa fourchette, ce geste qu'elle fait toujours avant d'attaquer un autre sujet, comme pour se donner de l'élan.",
  ['m',"Et sinon, Dylan, ça avance où, cette histoire ?"],['y',"C'est pas une histoire. C'est mon copain."],['m',"Je dis pas le contraire. Je dis juste que tu passes beaucoup de temps là-bas, pour quelqu'un que tu connais depuis deux mois."],
  "J'ai senti la chaleur remonter le long de ma nuque, cette sensation familière que je sais d'habitude canaliser.",
  ['m',"Et Johann, tu le vois encore beaucoup ? Ou c'est passé de mode, comme le reste ?"],['y',"De quoi tu parles ?"],['m',"De rien. Je constate, c'est tout. Tes amis changent vite, ces derniers temps."],
  "Elle ne sait rien de ce qu'ils étaient vraiment, avant. Quelque chose s'est mis à cogner derrière mes tempes, un martèlement sourd, plus lourd que l'agacement habituel.",
  ['y',"Tu peux pas juste me laisser vivre ma vie deux minutes ?"],['m',"Je te parle, c'est tout. C'est interdit maintenant ?"],['y',"C'est jamais juste « parler » avec toi. C'est toujours en train de peser chaque truc que je fais."],
  ['m',"Parce que tu crois que je vais rester silencieuse pendant que tu t'éloignes de tout le monde qui compte vraiment pour toi ?"],
  "Mes mains s'étaient refermées sous la table, les ongles plantés dans mes paumes, assez fort pour laisser des marques que je retrouverais plus tard.",
  ['m',"Qui compte vraiment pour toi."],['y',"Tu sais rien de ce qui compte pour moi."],['m',"Ah oui ? Éclaire-moi, alors."],['y',"STOP !!!"]]});
shot({bg:'salon',tint:['#5a0f10',.25,0,.1],
 cast:{m:P('mere',380,{expr:'open',anim:'none'}),y:P('yoann',860,{coat:false,expr:'angry',anim:'punch',pd:.1,pal:{top:'#16171b'}})},
 extra:(T)=>`<g class="txt" style="--d:1.2s">${C(1000,404,16,'#2b2118')}<path d="M1000,404 l-30,-22 M1000,404 l32,-12 M1000,404 l6,34 M1000,404 l-20,26" stroke="#2b2118" stroke-width="4"/></g>`+ring(1000,404,1.2,30),
 beats:["Je ne me souviens même plus d'avoir décidé de me lever. La chaise a raclé le sol, un bruit sec qui a résonné plus fort que tout le reste, et avant d'avoir compris ce que je faisais, mon poing s'est écrasé contre le mur du salon, juste à côté du cadre où on nous voit tous les deux, plus jeunes, souriants.",
  "La douleur est arrivée après, en retard, comme si mon corps avait agi sans demander mon avis. Un petit trou s'est ouvert dans le plâtre, exactement à la forme de mes phalanges, net, presque propre dans sa violence.",
  "Le silence qui a suivi était pire que tout ce que j'aurais pu dire. Ma mère s'était figée, et j'ai vu sur son visage quelque chose que je ne lui avais jamais vu — pas de la colère, pas vraiment de la peur non plus, plutôt une sidération totale, comme si elle découvrait quelqu'un qu'elle ne connaissait pas.",
  ['m',"Yoann..."],['y',"Ça suffit, j'ai dit."],
  "Ma voix ne tremblait pas. C'est peut-être ça qui m'a fait le plus peur, après coup : le calme presque plat avec lequel ces deux mots sont sortis, comme si la partie de moi qui venait de frapper le mur et celle qui parlait maintenant n'étaient plus tout à fait la même personne."]});
shot({bg:'rueNf',cast:{y:P('yoann',640,{anim:'walk',expr:'sad',phone:1})},
 beats:["Je n'ai pas attendu de réponse. J'ai attrapé mon manteau resté sur le dossier de la chaise, mon téléphone sur le buffet, et je suis sorti sans un regard en arrière, dévalant les escaliers plutôt que d'attendre l'ascenseur, comme si rester une seconde de plus dans cette cage aurait suffi à tout faire recommencer.",
  "L'air froid m'a saisi d'un coup, et c'est seulement là, sur le trottoir, sous le lampadaire qui grésille depuis des mois sans que personne vienne le réparer, que j'ai senti vraiment ma main — les jointures qui commençaient à enfler, cette douleur sourde qui battait au rythme de mon cœur, encore beaucoup trop rapide.",
  "J'ai sorti mon téléphone, les doigts tremblants, et j'ai écrit à Dylan, pour la première fois depuis longtemps sans réfléchir à ce que j'allais dire.",
  ['@640,300',"Je peux venir ce soir ? J'ai besoin de sortir d'ici.",'msg'],['@640,300',"Bien sûr mon cœur, tu peux venir. Il y a un problème ?",'msg2'],['@640,300',"Je t'expliquerai quand je serai là.",'msg'],['@640,300',"Ok mon cœur, à toute à l'heure.",'msg2'],
  "J'ai marché jusqu'à la station sans vraiment sentir mes pas, la main serrée contre moi, l'esprit étrangement vide après cette explosion — comme si tout ce qui aurait dû tourner en boucle dans ma tête s'était tu d'un coup, remplacé par ce seul mouvement : avancer, prendre le prochain train, s'éloigner."]});

/* ================= CHAPITRE 5 ================= */
chap('Chapitre 5','Ceux qui restent');
shot({bg:'quaiF',cast:{d:P('dylan',640,{expr:'neutral'}),y:P('yoann',160,{anim:'walk',go:[1,380,3],expr:'sad'})},
 beats:["Dylan m'attendait déjà à la sortie du RER, malgré l'heure tardive, les mains enfoncées dans les poches de son sweat, le regard scrutant chaque personne qui descendait du quai avant de tomber enfin sur moi.",
  "Il n'a rien demandé tout de suite. On a marché jusque chez lui sans un mot pendant cinq bonnes minutes, nos pas calés l'un sur l'autre presque sans y penser, juste sa main qui a fini par trouver la mienne."]});
shot({bg:'sdb',cast:{d:P('dylan',500,{expr:'sad',anim:'hands'}),y:yh(780,{expr:'sad',anim:'hands'})},
 beats:["Une fois à l'intérieur, dans la salle de bain éclairée d'une lumière un peu trop blanche, il a nettoyé mes jointures avec une douceur presque exagérée, penché sur ma main comme s'il s'agissait d'un objet précieux, concentré sur ce geste comme si s'occuper de mes mains lui permettait de ne pas me poser toutes les questions qui devaient se bousculer dans sa tête."]});
shot({bg:'lit',extra:heads(560),
 beats:["Ce n'est qu'après, allongés côte à côte dans le noir, la lumière de la rue filtrant à travers les rideaux mal fermés, qu'il a fini par demander ce qui s'était passé. Je lui ai raconté, par fragments, la phrase de ma mère, le mur, ce calme étrange qui avait suivi. Il a écouté sans m'interrompre, sans juger non plus, juste sa main posée sur la mienne.",
  ['@560,440',"T'as le droit d'être en colère. Juste, fais gaffe à toi aussi.",'msg2'],
  "On n'a plus parlé de ça après. On a regardé un film à moitié, plus pour le bruit familier que pour l'histoire, et je me suis endormi avant la fin, pour la première fois depuis des jours sans repasser en boucle tout ce qui n'allait pas."]});
shot({bg:'parc',cast:{l:P('lohane',520,{expr:'laugh',anim:'laugh'}),y:P('yoann',760,{expr:'laugh',anim:'laugh'})},
 extra:R(980,500,0,0,'#000')+`<g transform="translate(1040,640)"><ellipse cx="0" cy="-30" rx="40" ry="24" fill="#c98b4a"/><circle cx="40" cy="-52" r="20" fill="#c98b4a"/><rect x="-30" y="-14" width="10" height="22" fill="#a56f35"/><rect x="18" y="-14" width="10" height="22" fill="#a56f35"/></g>`+A('mere',{x:1160,s:.8,expr:'smile',pal:{top:'#5a8a6a',hair:'#ccc'},anim:'idle'}),
 beats:["Le lendemain, samedi, je me suis réveillé tard dans cet appartement qui n'était pas le mien mais où je me sentais plus chez moi que dans le mien. Après un petit-déjeuner partagé en silence, presque tendre, j'ai repris le chemin inverse, RER puis métro, pour retrouver Lohane en fin de matinée.",
  "Je ne lui ai pas tout raconté — pas encore — mais elle a dû sentir quelque chose, parce qu'elle a proposé qu'on aille marcher plutôt que de rester enfermés quelque part.",
  "On a fini par échouer dans un parc qu'on connaît par cœur, à se raconter des bêtises sans queue ni tête, à rejouer une scène ridicule qu'on avait vécue ensemble des mois plus tôt jusqu'à ne plus pouvoir s'arrêter de rire, pliés en deux sur un banc, sous le regard amusé d'une dame qui promenait son chien.",
  "Avec elle, c'est toujours pareil : je ne calcule rien, je ne retiens rien, je ris pour de vrai, sans cette distance que je garde presque partout ailleurs."]});
shot({bg:'chambreJ',cast:{j:P('johann',500,{expr:'smile',anim:'laugh'}),y:P('yoann',360,{expr:'smile'})},
 beats:["En début d'après-midi, j'ai rejoint Johann chez lui. Avec lui, les sujets reviennent toujours aux mêmes deux passions : l'informatique et les voitures.",
  "On a passé des heures sur son ordinateur à comparer des configurations qui n'existeraient probablement jamais dans nos budgets, à débattre vingt minutes sur la pertinence d'une carte graphique plutôt qu'une autre, puis il a sorti des photos de moteurs sur son téléphone, en m'expliquant avec une précision presque maniaque la différence entre deux modèles que je ne connaissais pas.",
  "Je ne comprenais pas la moitié de ce qu'il racontait, mais ça n'avait aucune importance. Il y a quelque chose d'apaisant à écouter quelqu'un parler avec autant de passion de quelque chose qui ne me demande rien en retour, juste d'être là, assis dans sa chambre qui sent toujours vaguement l'essence de moto miniature et le café instantané."]});
shot({bg:'salon',cast:{m:P('mere',380,{expr:'neutral',anim:'idle'}),y:P('yoann',900,{coat:true,expr:'neutral',go:[0,-420,3]})},
 beats:["En fin d'après-midi, je suis repassé chez moi récupérer quelques affaires pour le week-end, croisant à peine ma mère dans le couloir, un échange de regards bref et silencieux, ni froid ni chaleureux, simplement suspendu."]});
shot({bg:'salon',cast:{pe:P('pere',560,{expr:'smile',beard:1}),y:P('yoann',780,{coat:false,expr:'smile'})},extra:R(380,430,620,210,'#5a6f9a','rx="30"')+R(380,380,620,110,'#6b80ab','rx="30"'),
 beats:["Puis j'ai pris les transports pour rejoindre mon père. C'était son week-end, et je le retrouve toujours avec ce même mélange de soulagement et de légèreté, comme si l'air lui-même devenait plus simple à respirer une fois chez lui.",
  "On a mangé en parlant de tout et de rien, de son travail, d'un voyage qu'il projetait de faire, puis on a enchaîné sur un film, avachis tous les deux dans le canapé jusqu'à ce que le sommeil me tombe dessus sans prévenir. Je n'ai pas parlé du mur, ni de ma mère, ni de rien de tout ça. Pour quelques heures, porté par ce rythme qu'il impose à nos week-ends, j'ai réussi à ne plus y penser du tout."]});
shot({bg:'rueJ',cast:{pe:P('pere',300,{anim:'run',go:[0,700,6],expr:'laugh'}),y:P('yoann',200,{coat:true,anim:'run',go:[0,420,6],expr:'smile'})},
 beats:["Le lendemain matin, il est parti courir pendant que j'enfourchais son vieux vélo pour rouler à côté de lui une partie du trajet, le vent froid me piquant le visage, avant de le laisser filer plus vite que moi sur la dernière ligne droite, riant tout seul de le voir accélérer comme s'il avait encore vingt ans."]});
shot({bg:'cuisine',table:[400,980,500,'#c9a77a','#a98859'],cast:{pe:P('pere',620,{expr:'laugh',beard:1,anim:'laugh'}),y:P('yoann',860,{coat:false,expr:'smile'})},extra:R(520,470,60,30,'#4caf50')+R(700,470,40,30,'#e53935')+R(770,478,40,22,'#f2c14e'),
 beats:["On s'est ensuite arrêtés faire quelques courses, lui décidant tout, moi portant les sacs sans vraiment réfléchir à ce qu'on achetait, et on a fini par cuisiner ensemble en fin de matinée, dans cette cuisine trop petite pour deux mais où on trouve toujours notre place.",
  ['pe',"Tu les coupes beaucoup trop gros, tes légumes !"],
  "L'après-midi est passé devant une série qu'il regardait depuis des semaines et qu'il voulait absolument me faire découvrir, les deux affalés sur le canapé, sans grande conversation, juste cette présence tranquille qui n'exige rien."]});
shot({bg:'voiture',cast:{pe:P('pere',420,{y:700,s:1.05,beard:1,anim:'idle',expr:'neutral'}),y:P('yoann',860,{y:700,coat:true,anim:'idle',expr:'sad'})},tint:['#000',.2,0],
 beats:["Puis il m'a raccompagné en voiture jusque chez ma mère, la radio en fond sonore, les rues qui défilaient dans la pénombre du dimanche soir.",
  "Pendant tout le trajet, l'image du trou dans le plâtre est revenue, nette, intacte, comme si elle m'avait attendu patiemment tout ce temps, tapie derrière chaque instant de calme que j'avais réussi à m'accorder. Je savais qu'il faudrait y retourner, tôt ou tard. Le trajet touchait déjà à sa fin, et avec lui, cette parenthèse que j'aurais voulu voir durer un peu plus longtemps."]});

/* ================= CHAPITRE 6 ================= */
chap('Chapitre 6','Sarah');
shot({bg:'couloir',cast:{j:P('johann',500,{expr:'smile'}),y:P('yoann',780,{expr:'neutral'})},
 beats:["La vie a repris son cours normal les jours suivants — le lycée, le trampoline, les allers-retours chez Dylan — et c'est dans ce train-train retrouvé que Johann me l'a annoncé, un mardi, entre deux cours, avec ce sourire qu'il n'arrivait pas à contenir.",
  ['j',"J'ai rencontré quelqu'un."],['y',"Ah ouais ? Depuis quand ?"],['j',"Une semaine. Elle s'appelle Sarah. On s'est croisés à une soirée chez un pote de mon cousin."],
  "Je me souviens avoir souri aussi, sincèrement, parce que c'était rare de le voir comme ça, presque léger. Johann n'est pas du genre à s'emballer : d'habitude, il garde ses enthousiasmes pour les moteurs et les processeurs, pas pour les gens.",
  ['j',"Je te la présente bientôt. Je crois que tu vas bien l'aimer."]]});
shot({bg:'parc',cast:{s:P('sarah',640,{expr:'neutral',phone:1}),j:P('johann',380,{expr:'smile',enter:'L',delay:8}),y:P('yoann',940,{expr:'neutral'})},
 beats:["Ça s'est fait dès le samedi suivant : un après-midi au parc avec lui, elle, et moi. Je l'ai vue de loin avant même qu'on nous présente — assise sur un banc, en train de vérifier son téléphone avec cette concentration particulière, comme si le monde autour n'existait pas tant que l'écran restait allumé.",
  ['j',"Sarah, je te présente Yoann, mon meilleur ami."],['s',"Ah, le fameux Yoann. J'ai entendu parler de toi."],['y',"En bien j'espère."],['s',"Plus ou moins."],
  "Ce n'était rien. Une blague, sûrement, le genre de petite pique qu'on se permet en rencontrant les amis de quelqu'un. Johann la regardait avec cette expression que je ne lui connaissais pas, presque émerveillé. C'est seulement plus tard, une fois rentré, que quelque chose s'est mis à me chiffonner, sans que je sache nommer quoi."]});
shot({bg:'chambreJ',table:[0,0,0],cast:{j:P('johann',500,{expr:'neutral'}),s:P('sarah',860,{expr:'smirk',phone:1}),y:P('yoann',320,{coat:false,expr:'neutral'})},
 beats:["La deuxième fois, c'était une semaine plus tard, chez Johann, un mercredi après les cours. On devait avancer sur un projet informatique, comme d'habitude, sauf qu'elle était déjà là, installée dans le fauteuil que Johann garde pour ses invités.",
  ['s',"Tiens, le fameux Yoann."],
  "On a travaillé, tant bien que mal, elle sur son téléphone la plupart du temps, interrompant de temps en temps. Rien de méchant, pris isolément. Mais Johann répondait de plus en plus vite à chacune de ses interventions, comme s'il fallait qu'il lui accorde son attention immédiatement, sous peine de quoi.",
  ['y',"On devrait se concentrer."],['j',"Ouais, pardon."],
  "Elle a levé les yeux vers moi, une fraction de seconde : pas franchement hostile, mais pas neutre non plus. Comme si je venais de lui prendre quelque chose qui lui appartenait.",
  ['s',"Vous êtes toujours aussi sérieux tous les deux avec vos trucs d'ordinateur ?"],['j',"C'est notre truc."],
  "Je suis reparti ce soir-là avec une sensation diffuse, comme une odeur qu'on n'arrive pas à identifier mais qui reste accrochée."]});
shot({bg:'fastfood',table:[260,1160,500,'#eee','#ccc'],
 cast:{j:P('johann',420,{expr:'neutral',cls:'shrink'}),s:P('sarah',680,{expr:'smirk'}),m:P('manon',880,{expr:'laugh',anim:'laugh'}),l:P('lucas',1060,{expr:'laugh',anim:'laugh'})},
 beats:["Trois semaines après leur rencontre, Sarah a organisé une sortie de groupe — une idée à elle, tenait-elle à préciser, pour que tout le monde apprenne à se connaître. On s'est retrouvés à sept ou huit dans un fast-food du centre, un samedi soir, et c'est là que j'ai vu pour la première fois les deux inséparables qui l'accompagnaient : Manon, sa meilleure amie depuis le collège, et Lucas, un grand efflanqué qui riait fort à chaque blague de Sarah avant même qu'elle ne soit terminée.",
  "À un moment, Johann a raconté une anecdote — une histoire de voiture calée en plein carrefour pendant ses cours de conduite, drôle en soi, le genre d'histoire qu'il raconte bien d'habitude, avec des mimiques et du rythme. Sarah l'a coupé au milieu, en riant.",
  ['s',"Non mais arrête, tu la racontes trop mal, laisse-moi faire."],
  "Et elle l'a refaite à sa place, devant tout le monde, avec plus d'aplomb que lui, pendant que Manon et Lucas riaient plus fort qu'ils n'avaient ri pour la version de Johann. Il a souri, un peu crispé, et n'a plus rien dit du reste du repas.",
  "Plus tard, alors qu'on discutait de partir plus tôt ou plus tard, j'ai vu Johann sortir son téléphone, taper rapidement un message, puis attendre, le regard fixé sur l'écran.",
  ['j',"Ouais, on peut rester encore un peu."],
  "Personne ne lui avait rien demandé directement. J'ai compris, après coup, qu'il venait de demander la permission — à elle, assise juste en face de lui, qui avait à peine hoché la tête sans lever les yeux de son propre téléphone."]});
shot({bg:'lycee',cast:{j:P('johann',640,{expr:'sad',cls:'shrink'}),y:P('yoann',900,{expr:'neutral'})},
 beats:["Les jours suivants, j'ai remarqué qu'elle revenait dans presque toutes les conversations avec Johann, même celles qui n'avaient rien à voir avec elle.",
  ['j',"Sarah dit que je devrais changer ma coupe."],['j',"Sarah trouve ça nul comme film, du coup on regardera autre chose."],['j',"Sarah voulait pas que je sorte ce soir, du coup je passe."],
  "Ce n'était encore que des détails, mais après la soirée au fast-food, ils prenaient un tout autre poids. Je n'étais pas à l'aise avec elle : cette sensation de devoir surveiller ce que je disais, comme si chaque mot pouvait être retenu contre moi plus tard — et cette autre, plus dérangeante, de voir Johann rapetisser un peu à chaque fois qu'elle prenait toute la place.",
  "Je n'en ai parlé à personne, ni à Lohane, ni à Dylan. Je me disais que ce n'était que des impressions. Johann avait l'air heureux, la plupart du temps. C'était tout ce qui comptait, pour l'instant, même si ce « pour l'instant » commençait à sonner de plus en plus creux."]});

/* ================= CHAPITRE 7 ================= */
chap('Chapitre 7','Ce que je n\'ai pas voulu voir');
shot({bg:'lycee',cast:{y:P('yoann',500,{expr:'neutral'}),j:P('johann',780,{expr:'neutral',phone:1})},
 beats:["Les semaines qui ont suivi, quelque chose s'est mis à changer chez Johann, par petites touches que j'ai d'abord préféré ne pas voir. Les messages du soir, ceux qu'on s'échangeait presque tous les jours depuis des années, sont devenus plus courts, plus espacés, parfois absents pendant deux ou trois jours. À la récréation, il vérifiait son téléphone toutes les cinq minutes, avec un petit mouvement de mâchoire qui trahissait quelque chose. Ses blagues tombaient un peu à plat. Il riait encore, mais ce rire ne montait plus jusqu'aux yeux.",
  ['y',"T'es sûr que ça va ?"],['j',"Ouais, pourquoi tu demandes ça ?"],['y',"Sais pas. T'as l'air ailleurs, ces derniers temps."],['j',"C'est les cours. Ça devient chaud, avec le bac qui approche."],
  "Je n'ai pas insisté. Avec Johann, les choses sortent quand elles doivent sortir. Mais sa réponse sonnait comme une explication préparée à l'avance.",
  "Il annulait aussi, de plus en plus souvent, nos sessions sur l'informatique et les voitures : « Sarah a prévu un truc », « Sarah veut qu'on voie sa famille », « Sarah préfère qu'on reste tous les deux ce soir ». Moins de temps pour moi, moins de temps pour tout ce qui n'était pas elle."]});
shot({bg:'chambreJ',cast:{j:P('johann',560,{expr:'neutral',phone:1}),y:P('yoann',860,{coat:false,expr:'neutral'})},
 beats:["Le vrai déclic, c'est arrivé un samedi après-midi chez lui. On démontait le boîtier de son ordinateur pour changer un ventilateur, un truc prévu depuis deux semaines, quand son téléphone a vibré sur le bureau. Son visage a changé d'un coup — une sorte d'alerte muette, presque animale.",
  ['j',"C'est Sarah. Elle demande où je suis."],['y',"Ben tu lui dis que t'es chez toi, avec moi."],
  "Il tapait déjà, vite, les doigts un peu tremblants, avant de reposer le téléphone, soulagé, comme s'il venait d'éviter quelque chose. Le silence qui a suivi n'était pas naturel. Il restait là, l'oreille tendue vers son téléphone, prêt à réagir à la moindre vibration.",
  ['y',"Elle te demande souvent, comme ça ?"],['j',"Elle s'inquiète, c'est tout. Elle a eu un ex qui... enfin bref, elle a des raisons d'être comme ça."],['y',"Ça a l'air stressant, quand même."],['j',"C'est bon, Yoann, laisse tomber."],
  "Plus sec que je ne l'avais jamais entendu avec moi. J'avais vu, de mes propres yeux, un vrai réflexe de peur traverser le visage de mon meilleur ami à cause d'un simple message, et vu aussi qu'il défendait déjà la personne qui provoquait cette peur."]});
shot({bg:'rueJ',extra:R(380,180,520,460,'#b7a58a')+R(430,260,150,150,'#9fc7e8')+R(520,150,0,0,'#000')+R(690,260,150,150,'#3a3328')+R(680,250,170,170,'none','stroke="#6b5a45" stroke-width="8"')+[0,1,2,3,4].map(i=>R(690,270+i*28,150,10,'#2c261e')).join('')+`<g class="txt" style="--d:2s">${TX(505,450,'fenêtre ouverte, d\'habitude',20,'#222')}${TX(765,450,'volets fermés',24,'#a21')}</g>`,
 cast:{y:P('yoann',1060,{s:.9,expr:'sad'})},
 beats:["Quelques jours plus tard, en rentrant du trampoline, je suis passé devant chez lui presque sans réfléchir. Les volets de sa chambre étaient fermés alors qu'il faisait encore jour, ce qui ne lui arrivait jamais — Johann laisse toujours sa fenêtre ouverte, même en hiver, il dit que l'air confiné le rend dingue.",
  "Je n'ai pas sonné. Je suis resté là un instant, sur le trottoir, à regarder cette fenêtre close, en repensant à son visage ce samedi-là."]});
shot({bg:'chambre',cast:{y:yh(560,{expr:'cold',anim:'idle'})},tint:['#00293f',.4,0],
 extra:['NOM','ÂGE','ADRESSE','PHOTOS'].map((t,i)=>`<g class="txt" style="--d:${(6+i*1.4).toFixed(1)}s">${R(850,180+i*56,360,44,'#1d4e7a','rx="8"')}${TX(1030,210+i*56,t,22,'#cfeaff')}</g>`).join(''),
 beats:["C'est cette nuit-là que je me suis retrouvé sur mon téléphone, incapable de dormir, à taper le nom de Sarah dans un moteur de recherche. Cette fois, je savais ce que je cherchais : comprendre à qui on avait vraiment affaire, savoir si ce genre de comportement avait un précédent. Mes talents pour naviguer entre les informations, d'habitude réservés à des services qu'on me demandait, se sont mis au service de cette question-là.",
  "Les recherches ont pris des heures — un profil menant à un autre, une photo ancienne, un prénom de famille retrouvé au détour d'un commentaire oublié, Manon et Lucas qui revenaient sans cesse sous ses publications, toujours à valider, toujours à applaudir.",
  "Petit à petit, un dossier s'est formé sur mon téléphone : nom, âge, adresse, un fil de photos plus anciennes qui dessinaient un autre visage que celui qu'elle montrait d'ordinaire. Je ne l'ai pas montré à Johann. Je ne savais pas ce que j'en ferais. Mais je ne l'ai plus refermé avec l'idée de ne jamais m'en servir. Je l'ai gardé, prêt, comme une chose qu'on prépare quand on sent qu'on en aura besoin."]});
shot({bg:'salon',table:[380,900,480,'#9c7a52','#7d5f3d'],cast:{m:P('mere',480,{expr:'neutral'}),y:P('yoann',800,{coat:false,expr:'neutral',phone:1})},
 extra:(T)=>`<g class="pulse">${R(570,456,34,22,'#111','rx="4"')}</g>`,
 beats:["Les jours suivants, Johann a continué de s'éloigner, doucement. La mâchoire crispée, les messages rares, cette fenêtre fermée qui restait dans un coin de ma tête, et sous tout ça, cette peur furtive que je n'arrivais plus à oublier. Jusqu'à ce jeudi soir.",
  "J'étais à table avec ma mère, un repas sans histoire. Le trou dans le mur du salon, réparé depuis, avait laissé une trace un peu plus claire que le reste de la peinture, qu'on évitait tous les deux de regarder trop longtemps. Mon téléphone a vibré sur la table, écran retourné comme toujours pendant les repas : le prénom de Johann.",
  "Ça m'a arrêté net. Johann ne m'appelle jamais. Un vrai appel, c'est arrivé peut-être trois fois en autant d'années. J'ai senti quelque chose se resserrer dans ma poitrine avant même d'avoir décroché.",
  ['y',"Je reviens."],['y',"Allô ?"],['@640,250',"Yoann... tu peux venir ? S'il te plaît.",'msg2'],['y',"Johann, qu'est-ce qui se passe ?"],['@640,250',"Viens, c'est tout. S'il te plaît, viens.",'msg2'],['y',"J'arrive."],
  "Je n'ai même pas pris le temps d'expliquer à ma mère. J'ai juste crié « je reviens, urgence avec Johann » en traversant l'entrée."]});
shot({bg:'rueNr',cast:{y:P('yoann',640,{anim:'run',it:999,expr:'cold'})},ghost:[['y',1]],
 extra:`<g class="txt" style="--d:2s">${TX(1060,120,'15 min → 3 min',48,'#8fe3ff','font-weight="700"')}</g>`,
 beats:["Je ne me souviens pas vraiment d'avoir couru. Je me souviens d'un état second, mon corps qui avançait plus vite que mes pensées, les rues qui défilaient sans que je les regarde, les distances écrasées par quelque chose que je n'aurais jamais cru possible avant ce soir-là.",
  "Le trajet que je fais d'ordinaire en quinze minutes de marche, en cinq en courant les jours où je suis pressé, je l'ai fait en trois. Je ne l'ai su qu'après, en regardant l'heure."]});
shot({bg:'palier',cast:{j:P('johann',720,{expr:'cry',marks:1,anim:'idle'}),y:P('yoann',420,{expr:'sad',anim:'hands'})},
 extra:R(900,330,200,320,'#1b1e27','rx="16"'),
 beats:["J'ai frappé à sa porte, et c'est lui qui a ouvert. Je n'étais même pas essoufflé, comme si quelqu'un d'autre avait pris le contrôle de mon cœur le temps de courir jusque-là, et me l'avait rendu intact.",
  "Je ne l'avais jamais vu comme ça. Le visage rouge et gonflé de larmes, les yeux presque fermés à force d'avoir pleuré, tout son corps secoué par des sanglots. Johann, qui ne pleure jamais, qui trouve toujours une vanne pour désamorcer les situations tendues.",
  ['y',"Hé, je suis là."],['y',"C'est bon, prends ton temps. Je bouge pas."],
  "C'est en levant un peu la tête, pour le regarder dans les yeux, que je l'ai vu. Des marques sur sa nuque, plusieurs, à différents degrés — certaines déjà virant au violet, d'autres encore rouges. Pas une seule trace isolée : la répétition d'un même geste, encore et encore.",
  ['y',"Johann. C'est quoi, ça ?"],
  "Il a baissé les yeux, la honte visible sur tout son visage, avant de sortir son téléphone, les mains tremblantes.",
  ['j',"Regarde."]]});
shot({bg:'palier',tint:['#06304b',.35,3],cast:{j:P('johann',720,{expr:'sad',marks:1}),y:P('yoann',420,{expr:'cold'})},
 extra:R(840,250,240,380,'#1b1e27','rx="20"')+`<g class="txt" style="--d:1s">${TX(960,300,'Sarah · Manon · Lucas',20,'#8fe3ff')}</g>`,
 beats:["C'était une conversation de groupe. Sarah, Manon, et Lucas. Des messages qui remontaient sur plusieurs jours. Des moqueries sur son physique, sur sa façon de parler, des captures d'écran de photos de lui prises sans qu'il le sache, accompagnées de commentaires qui n'avaient rien de bienveillant. Et, glissée entre deux messages, une phrase de Sarah qui se vantait d'un truc qu'elle faisait « pour rire » : une claque à répétition sur la nuque, décrite avec une légèreté qui donnait la nausée.",
  "Je n'ai pas tout lu. Je n'ai pas eu besoin de tout lire.",
  ['y',"Depuis combien de temps ?"],
  "Ma voix était glaciale, presque méconnaissable, au point que Johann lui-même a eu un mouvement de recul imperceptible en l'entendant.",
  ['j',"Une semaine, à peu près. J'ai pas su comment... j'osais pas en parler."],
  "Quelque chose s'est figé en moi à cet instant précis. Pas une montée progressive, cette fois, pas cette chaleur familière. Quelque chose de beaucoup plus froid, plus immédiat, comme si tout mon corps venait de basculer d'un coup dans un état que je ne reconnaissais pas.",
  ['j',"Yoann ? Ça va ?"],"Je n'ai pas répondu."]});

/* ================= CHAPITRE 8 ================= */
chap('Chapitre 8','Celui qui a pris ma place');
shot({bg:'chambreJ',cast:{y:P('yoann',560,{y:640,coat:true,expr:'cold',anim:'kneel',phone:1}),j:P('johann',880,{expr:'cry',marks:1})},ghost:[['y',2]],tint:['#032439',.35,0],
 beats:["Je me suis assis par terre, dos contre le canapé, et j'ai sorti mon téléphone sans un mot. Johann me regardait faire, encore secoué de larmes, sans comprendre tout de suite.",
  ['j',"Yoann, qu'est-ce que tu fais ?"],
  "Mes doigts couraient déjà sur l'écran, presque indépendants du reste de moi. Un prénom, un nom glané dans la conversation, une photo de profil, et tout s'enchaînait à une vitesse qui m'a moi-même surpris. En quelques minutes à peine, j'avais les trois : Sarah, et les deux autres prénoms. Nom complet, adresse, tout ce qu'il fallait.",
  ['j',"Yoann, arrête. S'il te plaît, arrête ça. C'est pas... c'est pas la solution."],['y',"Ça va aller."],['j',"Non, justement, ça ne va pas aller. Regarde-moi. S'il te plaît."],
  "J'ai relevé les yeux, une seconde, et j'ai vu quelque chose se figer dans son expression — comme s'il venait de comprendre que la personne en face de lui n'était plus tout à fait celle qu'il connaissait depuis toujours.",
  ['y',"Je reviens."],
  "Il a essayé de m'attraper le bras une dernière fois. Je me suis dégagé, avec une facilité presque déconcertante, et je suis sorti dans la nuit sans un regard en arrière."]});
shot({bg:'palier',cast:{j:P('johann',640,{expr:'fear',phone:1,marks:1})},
 beats:["Je l'ai entendu, à travers la porte fermée, sortir son téléphone. Sa voix étouffée, paniquée, en train d'appeler. Il les avait mis en conférence tous les deux en même temps, sans doute pour ne pas perdre une seconde.",
  ['j',"Dylan, Lohane, c'est moi, il faut que vous m'aidiez. Yoann vient de partir et je sais pas ce qu'il va faire, il avait un regard que j'ai jamais vu. Il faut que vous l'appeliez, s'il vous plaît..."]]});
shot({bg:'rueNf',tint:['#032439',.4,0],cast:{y:P('yoann',420,{anim:'walk',go:[0,520,12],expr:'cold'}),f:P('lohane',1180,{s:.9,pal:{top:'#999',hair:'#333'},anim:'walk',go:[8,-340,2.2],expr:'fear'})},ghost:[['y',0]],
 beats:["Mon téléphone a commencé à vibrer presque tout de suite après. Lohane, une fois, deux fois. Puis Dylan. Puis Lohane encore. C'était comme regarder quelqu'un d'autre recevoir ces appels, à travers une vitre épaisse qui aurait tout étouffé.",
  ['@640,250',"Yoann décroche s'il te plaît",'msg2'],['@640,250',"Johann nous a tout raconté, on est inquiets, appelle-nous",'msg2'],['@640,250',"Où t'es là ?",'msg2'],
  "Une partie de moi savait qu'ils avaient raison de s'inquiéter. Une autre, beaucoup plus grande, beaucoup plus froide, avançait déjà, un pied devant l'autre, vers la première adresse. Comme si mon corps appartenait, pour ce soir, à quelqu'un de plus grand, de plus calme et de plus terrifiant que moi.",
  "À un moment, une femme qui marchait dans ma direction a changé de trottoir sans raison apparente, en me jetant un regard rapide avant de détourner les yeux, pressant le pas.",
  ['@640,250',"Mon cœur, enfin ! Où est-ce que t'es, dis-moi, s'il te plaît, on arrive, dis-nous juste où t'es.",'msg2'],
  "J'ai décroché, presque par automatisme. Sa voix tremblait, pleine d'une urgence que je percevais comme à travers un mur épais. Je n'ai rien répondu. J'ai raccroché, et j'ai continué à marcher. C'était fini d'essayer de me raisonner. Ce n'était plus moi qui décidais de ça, ni de rien d'autre ce soir-là."]});
shot({bg:'porte',tint:['#032439',.35,0],cast:{y:P('yoann',300,{expr:'cold'}),s:P('sarah',960,{expr:'fear',at:2})},ghost:[['y',0]],
 beats:["La première adresse était celle de Sarah. Un immeuble ordinaire, une entrée que j'ai franchie sans hésiter en suivant quelqu'un qui sortait. J'ai monté les étages, l'esprit d'un calme presque effrayant, et j'ai frappé. C'est elle qui a ouvert. Son sourire s'est effacé d'un coup en me voyant.",
  "Un instant. Puis :",
  ['y',"Tu vas t'habiller, et tu vas venir avec moi."],
  "Ma voix était plate, glaciale, presque détachée de moi-même. Elle a voulu protester, mais les mots ne sont pas sortis. Elle a juste hoché la tête, silencieuse, terrorisée d'une manière que je n'avais jamais vue chez personne avant ce soir. Les deux autres, retrouvés l'un après l'autre dans les rues voisines grâce aux mêmes recherches, n'ont pas opposé plus de résistance. Un mot, un regard, et ils suivaient, comme aimantés par quelque chose qu'ils ne comprenaient pas mais qu'ils savaient ne pas pouvoir défier."]});
shot({bg:'palier',tint:['#032439',.3,0],cast:{j:P('johann',1000,{expr:'sad',marks:1}),s:P('sarah',620,{anim:'kneel',expr:'cry',at:3}),m:P('manon',740,{anim:'kneel',expr:'cry',at:3}),l:P('lucas',860,{anim:'kneel',expr:'cry',at:3}),y:P('yoann',340,{expr:'cold'})},ghost:[['y',0]],
 beats:["Je les ai ramenés, tous les trois, jusque chez Johann. Il a ouvert la porte, le visage encore marqué par les larmes, et il s'est figé en nous voyant tous debout sur son palier.",
  ['j',"Yoann, qu'est-ce que..."],['y',"Ils ont quelque chose à te dire."],
  "Le silence s'est étiré, lourd, avant que Sarah ne s'avance, tremblante, et se laisse tomber à genoux devant lui, sans que j'aie eu besoin de prononcer un mot de plus.",
  ['s',"Je suis désolée, Johann. Vraiment désolée. Je sais pas ce qui m'a pris, je voulais pas... je voulais pas que ça aille aussi loin."],
  "Les deux autres ont suivi, un par un, chacun avec ses propres mots maladroits, sa propre voix brisée par la peur plus que par le vrai remords, sans doute. Mais ce soir-là, la différence ne comptait pour personne. Johann les regardait, l'un après l'autre, avec un mélange de soulagement, de honte, et de quelque chose qui ressemblait à de la peur, dirigée non pas vers eux, mais vers moi.",
  ['y',"Levez-vous."],"Ils se sont redressés, tous les trois, sans oser lever complètement les yeux vers moi.",
  ['y',"Vous allez partir maintenant. Et vous n'allez plus jamais vous approcher de lui. Plus jamais."],
  ['y',"Et si j'apprends qu'un seul d'entre vous fait souffrir quelqu'un d'autre comme ça, je vous retrouverai. Ma voix, mon regard, tout ce que vous venez de voir ce soir — je vous le garantis, la prochaine fois sera pire. Je vous hanterai jusqu'à la fin de votre existence."],
  "Personne n'a répondu. Sarah a hoché la tête, les larmes aux yeux, et ils sont partis presque en courant, descendant l'escalier dans un bruit de pas précipités qui s'est éteint peu à peu."]});
shot({bg:'palier',tint:['#032439',.45,0,.1],cast:{j:P('johann',600,{anim:'hug',expr:'cry'}),y:P('yoann',690,{anim:'hug',expr:'fear'})},
 extra:`<rect width="1280" height="720" fill="#032439"><animate attributeName="opacity" from="0" to="0" dur="1s" fill="freeze"/></rect>`,
 beats:["Une fois seuls sur le palier, Johann m'a regardé un long moment, sans rien dire. Puis il s'est avancé et m'a pris dans ses bras, fort, le visage enfoui contre mon épaule.",
  ['j',"Merci. Merci d'être venu."],
  "C'est là, dans cette étreinte, que quelque chose a cédé en moi, d'un coup, comme un barrage qui lâche après avoir trop longtemps résisté. Le froid qui m'habitait depuis que j'avais quitté ma mère, cette voix qui n'était plus la mienne, cette aura que je sentais sans la voir — tout s'est retiré en une seule vague, presque douloureuse, et j'ai senti mes jambes trembler sous moi.",
  ['y',"Johann... Qu'est-ce que j'ai fait ?"],
  "Il n'a pas répondu tout de suite. Il m'a juste serré un peu plus fort, comme pour m'empêcher de tomber."]});

/* ================= CHAPITRE 9 ================= */
chap('Chapitre 9','Ce qui reste de moi');
shot({bg:'rueN',cast:{y:P('yoann',640,{anim:'walk',it:999,expr:'sad'})},
 beats:["Je suis rentré à pied, cette nuit-là, malgré l'heure tardive. Je n'avais pas envie de métro, pas envie de gens, pas envie de rien d'autre que la sensation du trottoir sous mes pieds, régulière, rassurante dans sa banalité.",
  ['y',"Qu'est-ce que j'ai fait.",'think'],
  "La question tournait en boucle, sans jamais trouver de réponse qui tienne. Je revoyais des fragments — Sarah qui ouvre la porte, son sourire qui s'efface, ma propre voix que je ne reconnaissais pas, les trois à genoux devant Johann. Chaque image me revenait avec une clarté presque insoutenable, alors que je n'avais, sur le moment, presque rien ressenti. Pas de satisfaction. Pas vraiment de remords non plus, juste ce vide immense en train de se remplir, lentement, de quelque chose qui ressemblait à de la terreur — non pas envers eux, mais envers moi-même.",
  "C'est déjà arrivé une fois. Le mur. Mais ça, c'était un geste, une seconde de rupture, vite refermée. Ce soir-là, ça avait duré. Ça avait eu un but, une trajectoire, une froideur qui n'avait rien d'un débordement.",
  "J'ai repensé à ce jour-là, au collège, à ce bureau. Je m'étais dit que quelque chose s'était éteint en moi. Rien ne s'était éteint, peut-être. Ça s'était juste mis en veille, patiemment, en attendant une raison suffisante pour se rallumer d'un coup, sans demander la permission à qui que ce soit — pas même à moi."]});
shot({bg:'chambre',cast:{y:yh(600,{expr:'sad',anim:'idle'})},tint:['#000',.45,0],
 beats:["Je suis rentré chez moi sans faire de bruit, je me suis couché sans dormir, à fixer le plafond jusqu'à ce que le jour se lève."]});
shot({bg:'parc',tint:['#2a3a55',.25,0],cast:{l:P('lohane',520,{expr:'neutral'}),y:P('yoann',760,{expr:'sad'})},
 beats:["J'ai retrouvé Lohane le lendemain, en fin d'après-midi, dans ce même parc où on avait ri quelques mois plus tôt. Elle m'attendait déjà sur le banc, les bras croisés, et quand je me suis approché, j'ai vu dans son regard quelque chose que je n'y avais jamais vu. Pas de la colère. Une forme de prudence, comme si elle réévaluait quelque chose en temps réel.",
  ['l',"Johann m'a raconté ce qu'il savait. Mais je veux l'entendre de toi."],
  "Je me suis assis à côté d'elle, et je lui ai tout raconté, dans l'ordre, sans rien enjoliver ni minimiser. La conversation de groupe, les marques sur la nuque de Johann, la recherche, la voix qui n'était plus la mienne, les trois qui suivaient sans résister. Elle m'a écouté sans m'interrompre, le regard fixé quelque part devant elle.",
  ['l',"Tu me fais peur, quand tu racontes ça. Pas parce que t'as tort d'avoir voulu le protéger. Mais parce que je vois bien que t'as aimé ça, quelque part. Ou en tout cas, que tu t'es pas vraiment reconnu pendant que tu le faisais."],
  ['y',"Je sais pas ce que j'ai ressenti. C'est bien ça, le problème."],
  "Elle a posé sa tête sur mon épaule, sans rien ajouter tout de suite, et on est restés comme ça un moment, à regarder les gens passer, avant qu'elle ne reprenne, plus légère.",
  ['l',"Fais gaffe à toi, Yoann. C'est tout ce que je te demande."]]});
shot({bg:'lit',extra:heads(560),
 beats:["Avec Dylan, la conversation est venue différemment, un soir, allongés dans le noir comme la première fois après le mur. Il n'a pas eu besoin de me demander de raconter — je l'ai fait de moi-même, comme si le silence de la pièce m'y autorisait plus facilement que n'importe où ailleurs.",
  ['@640,420',"T'as pas eu peur, en apprenant ce qui s'était passé ?",'msg'],['@640,420',"Si. Énormément. Mais pas de toi, exactement. Peur de ce qui pouvait t'arriver, de ce que tu pouvais devenir si personne était là pour t'arrêter à temps.",'msg2'],['@640,420',"Et si personne avait été là ?",'msg'],
  "Il n'a pas répondu tout de suite. Sa main a cherché la mienne dans le noir, et il l'a serrée, fort.",
  ['@640,420',"C'est pour ça que je veux être là. Toujours. Même les soirs où t'as cette tête-là.",'msg2'],
  "Ce n'était pas une absolution. Je crois qu'il ne cherchait pas à m'en donner une. C'était juste une promesse, simple, sans conditions, et ça m'a suffi, ce soir-là, pour arriver enfin à fermer les yeux."]});
shot({bg:'lycee',cast:{j:P('johann',500,{expr:'neutral'}),y:P('yoann',780,{expr:'neutral'})},
 beats:["Avec Johann, ça a été le plus étrange. On s'est retrouvés au lycée, quelques jours après, à notre place habituelle contre la rambarde, et pendant un long moment, on n'a parlé de rien d'important, comme si tous les deux, on repoussait le moment.",
  ['j',"Merci encore. Pour de vrai. Sarah, Manon, Lucas — plus personne m'a recontacté depuis. Ni eux, ni personne de leur bande."],['y',"Tant mieux."],
  ['j',"Mais tu m'as fait flipper, aussi. Je sais pas comment dire ça sans que ça sonne mal, mais... j'ai eu l'impression de plus vraiment te reconnaître, pendant un moment."],['y',"Je sais."],['j',"Tu recommencerais ? Si ça se reproduisait ?"],
  "Je n'ai pas répondu tout de suite. J'ai repensé à cette question toute la soirée, sans jamais réussir à y répondre honnêtement, ni à lui, ni à moi-même.",
  ['y',"Je sais pas. J'espère juste que j'aurai jamais à me poser la question à nouveau."],
  "Il a hoché la tête, sans insister davantage, et on est repartis vers nos salles respectives, côte à côte, comme toujours, mais avec quelque chose de nouveau qui s'était glissé entre nous, discrètement, et qui ne partirait sans doute jamais complètement."]});

/* ================= CHAPITRE 10 ================= */
chap('Chapitre 10','Ma mère');
shot({bg:'salon',table:[380,900,480,'#9c7a52','#7d5f3d'],cast:{m:P('mere',480,{expr:'neutral'}),y:P('yoann',800,{coat:false,expr:'neutral'})},
 beats:["Le trou dans le mur du salon avait été réparé dès la semaine qui avait suivi cette soirée-là. La peinture avait beau être recouverte avec soin, on continuait tous les deux, sans jamais se le dire, à éviter cet endroit précis du regard.",
  "Dans les semaines qui avaient suivi cette dispute, les questions du matin s'étaient faites plus rares, plus courtes. Puis était venue cette autre nuit, des mois plus tard, celle avec Johann — celle-là, ma mère ne l'a jamais connue en détail. Mais elle a deviné qu'il s'était passé quelque chose, et elle marchait autour de moi comme on apprend à marcher autour d'un objet dont on découvre soudain qu'il peut casser. Ce n'était pas de la distance. C'était de la prudence.",
  "Un soir, alors qu'on dînait ensemble, elle a posé sa fourchette — ce même geste — et j'ai senti mon corps se raidir malgré moi.",
  ['m',"Johann m'a fait un compliment l'autre jour, en me croisant devant l'immeuble. Il m'a dit que j'avais de la chance de t'avoir comme fils. Que t'étais quelqu'un de loyal."],['y',"Ah."],
  ['m',"Il avait l'air sincère. Mais aussi un peu... je sais pas. Bizarre, en le disant. Comme s'il pensait à autre chose en même temps."],
  "Je n'ai rien dit. Elle a laissé le silence s'installer, sans le forcer, avant de reprendre, plus doucement que je ne l'avais jamais entendue.",
  ['m',"Il y a quelques mois, un soir, t'es sorti en pleine nuit sans rien expliquer, et t'es rentré différent. Je sais pas ce qui s'est passé ce soir-là. Je vais pas insister, tu me raconteras jamais, je crois. Mais je veux juste que tu saches que j'ai pas peur de toi, si c'est ce que tu crois."],
  ['y',"J'ai jamais pensé ça."],
  ['m',"Si, un peu. Je le vois dans ta façon de faire attention à chaque mot, avec moi, depuis. Comme si tu pesais si t'avais le droit de t'énerver ou pas."],
  "Elle avait raison, évidemment, plus qu'elle ne pouvait l'imaginer. Depuis le mur, et plus encore depuis cette autre nuit, je surveillais chaque montée de tension entre nous avec une vigilance presque maladive, terrifié à l'idée de ce qui pourrait se passer si je la laissais remonter une deuxième fois de la même façon.",
  ['m',"Je veux pas que tu marches sur des œufs avec moi. Je préfère qu'on se dispute, parfois, comme avant, plutôt que ce silence-là."],['y',"Je sais pas si je peux te promettre ça."],
  "Elle a hoché la tête, sans insister, et elle a repris son repas, mais quelque chose, dans la pièce, semblait un peu moins tendu qu'avant, comme si le simple fait d'avoir nommé la chose avait suffi à en désamorcer une partie.",
  "On ne s'est plus jamais disputés comme ce soir-là du mur, ni elle ni moi. Pas parce que tout allait bien, mais parce qu'on avait tous les deux appris à marcher un peu plus doucement autour de l'autre — elle par crainte de rallumer quelque chose qu'elle ne comprenait pas complètement, moi par peur de découvrir jusqu'où ça pourrait aller si je la laissais faire."]});

/* ================= CHAPITRE 11 ================= */
chap('Chapitre 11','La pause');
shot({bg:'chambreJ',cast:{j:P('johann',500,{expr:'laugh',anim:'laugh'}),y:P('yoann',360,{expr:'smile'})},
 beats:["Les mois ont fini par faire ce que les mois font toujours : ils ont émoussé les angles les plus vifs, sans jamais vraiment effacer ce qu'il y avait derrière.",
  "Johann a fini par revivre normalement, ou presque. Les marques sur sa nuque ont disparu bien avant que le reste ne se referme complètement, mais il a retrouvé ce rire qui monte jusqu'aux yeux, recommencé à raconter ses histoires sans se faire couper, repris nos sessions du samedi sur l'informatique et les voitures — sauf ce petit temps de flottement, parfois, quand un silence entre nous s'étire un peu trop longtemps, et que je le vois me regarder d'une façon qu'il n'avait pas avant."]});
shot({bg:'rueJ',cast:{j:P('johann',400,{go:[0,200,4],anim:'walk',expr:'neutral'}),s:P('sarah',1000,{pal:{top:'#d9698d'},anim:'walk',go:[1,300,2],expr:'fear',rx:-60,rxAt:1})},
 beats:["Sarah, Manon et Lucas n'ont plus jamais donné signe de vie. Johann m'a raconté, une fois, avoir croisé Sarah de loin dans un centre commercial, et qu'elle avait changé de trottoir en le voyant, avant même qu'il n'ait pu esquisser un geste dans sa direction.",
  "Je n'ai rien ressenti en l'apprenant. Ni satisfaction, ni remords. Juste un constat, froid, que les choses étaient allées exactement comme je l'avais annoncé ce soir-là."]});
shot({bg:'parc',cast:{y:P('yoann',640,{expr:'neutral'})},
 beats:["Ma vie a repris son rythme habituel, en apparence. Le lycée, le trampoline, les trajets vers chez Dylan, les week-ends chez mon père. J'ai continué d'aider certains camarades avec leurs exercices, sans plus vraiment m'interroger sur ce que ça me coûtait — c'était comme ça, et ça resterait probablement comme ça.",
  "Mais quelque chose, en dessous, avait changé pour de bon. Avant, quand la colère montait, je respirais, je comptais, je serrais les poings, sans jamais savoir ce qu'il y avait de l'autre côté si je laissais faire. Maintenant, je savais. J'avais vu, de mes propres yeux, jusqu'où ce quelque chose pouvait aller. Et cette connaissance-là ne me quittait plus, tapie derrière chaque petite contrariété, chaque friction du quotidien."]});
shot({bg:'couloir',cast:{y:P('yoann',500,{expr:'neutral'}),mx:P('lucas',900,{pal:{top:'#4a6a8a',hair:'#111'},expr:'smirk',go:[1,-300,1.4]})},tint:['#032439',.3,2,.5],
 beats:["Un jour, en cours, un type de ma classe — un certain Maxime, que je connaissais à peine — m'a bousculé un peu trop fort dans le couloir, sans s'excuser, avec ce petit sourire narquois de celui qui teste jusqu'où il peut aller.",
  "La chaleur familière est montée le long de ma nuque, plus vite que d'habitude, plus intense aussi. Pendant une fraction de seconde, j'ai senti cette même bascule que j'avais connue deux fois déjà, ce basculement vers le froid, vers l'absence. Je me suis arrêté, en plein couloir, et j'ai fermé les yeux une seconde.",
  ['y',"Pas pour ça. Pas pour un couloir.",'think'],
  "J'ai laissé le silence retomber, j'ai continué mon chemin sans un mot, et j'ai senti mon cœur battre fort pendant plusieurs minutes après, comme si mon corps, lui, n'était pas complètement convaincu que j'avais fait le bon choix.",
  "Ce n'était plus tout à fait la même retenue qu'avant. Avant, je maîtrisais quelque chose que je ne connaissais pas vraiment. Maintenant, je maîtrisais quelque chose dont je connaissais exactement la forme, le poids, la vitesse à laquelle ça pouvait tout emporter. C'était plus lourd à porter. Mais c'était aussi, je crois, ce qui me permettait de tenir."]});
shot({bg:'parc',tint:['#e49b3a',.15,0],cast:{y:P('yoann',640,{expr:'neutral'})},
 beats:["Avec ma mère, les choses avaient trouvé un nouvel équilibre, fragile mais réel. On ne se disputait plus vraiment, mais on ne s'évitait plus non plus. Avec mon père, rien n'avait changé, comme toujours. Avec Lohane, Johann et Dylan, une complicité un peu différente s'était installée, plus consciente de ce que chacun représentait pour moi, et de ce que j'étais prêt à faire pour eux.",
  "L'automne a laissé place à l'hiver, puis le printemps est arrivé, et avec lui cette sensation étrange d'avoir traversé quelque chose sans savoir si c'était terminé, ou si ce n'était qu'une pause.",
  "C'était une pause. Elle a duré plusieurs semaines encore, tranquille, presque convaincante — jusqu'à cette nuit de la fin de l'hiver."]});

/* ================= CHAPITRE 12 ================= */
chap('Chapitre 12','Trente minutes');
shot({bg:'chambre',cast:{y:yh(560,{expr:'open',phone:1,anim:'idle'})},tint:['#000',.35,0],
 beats:["Le téléphone a vibré sur ma table de chevet un peu après minuit, un soir de semaine ordinaire, alors que je somnolais déjà à moitié devant un épisode que je ne regardais plus vraiment. Le prénom de Dylan s'est affiché dans le noir, et j'ai décroché sans même m'asseoir complètement.",
  ['y',"Allô ?"],
  "Rien, d'abord. Juste une respiration, hachée, irrégulière, qui ne ressemblait à rien de ce que j'avais l'habitude d'entendre de lui.",
  ['@900,330',"Yoann... je me suis fait agresser.",'msg2'],
  "Les quatre mots ont mis une seconde entière à traverser vraiment ma conscience. Puis quelque chose s'est mis en mouvement en moi, que j'avais déjà senti deux fois, et qui montait cette fois plus vite encore.",
  ['y',"Quoi ? T'es où ? Ça va ?"],
  "Ma propre voix m'a semblé trop calme pour ce que je ressentais en dessous — une chaleur brutale qui n'avait rien à voir avec celle, plus douce, que je connaissais face à ma mère. Celle-ci est arrivée d'un coup, entière, comme si elle avait attendu cet appel précis pour se déclencher.",
  ['@900,330',"Je suis devant chez moi. Ils m'ont pris mes courses, et... ma montre. Ils sont partis en courant.",'msg2'],
  ['y',"J'arrive. Bouge pas, j'arrive."]]});
shot({bg:'rueNr',cast:{y:P('yoann',640,{anim:'run',it:999,expr:'cold'})},ghost:[['y',2]],
 extra:`<g class="txt" style="--d:6s">${TX(640,110,'30 min',72,'#8fe3ff','font-weight="800"')}${TX(640,150,'au lieu de 60 en transport',24,'#ffffffcc')}</g>`,
 beats:["J'ai raccroché avant même la fin de sa phrase suivante. Mes mains tremblaient déjà en attrapant mes chaussures, pas de peur, pas d'agitation ordinaire — quelque chose de plus dur, de plus concentré, comme si tout mon corps se resserrait autour d'un seul point.",
  "Le trajet, d'habitude, c'est une heure de transport, RER puis métro. Cette nuit-là, je n'ai même pas eu la patience d'envisager une station. Je suis descendu les escaliers quatre à quatre, et une fois dans la rue, j'ai couru. Je n'ai jamais couru comme ça. Mes jambes avançaient plus vite que ce que je croyais possible, une sensation de dévorer la distance plutôt que de la traverser.",
  "Les rues défilaient dans un flou orangé de lampadaires, comme si la ville entière avait accepté de se plier, de se compresser, pour que j'arrive plus vite. Je ne sentais presque plus mes appuis au sol. J'avais l'impression de voler.",
