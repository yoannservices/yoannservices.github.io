<!DOCTYPE html>
<html lang="fr" data-cat="loisirs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUICKPLAY  -  Mémoire</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../../assets/theme.css" />
<script src="../../../assets/site.js" defer></script>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/memory.css">
</head>
<body>
<div id="stars"></div>
<div id="game-memory" class="screen active">
  <button class="btn-back" onclick="backToHub()">← Retour</button>
  <h2 class="game-title">🧠 Mémoire</h2>
  <div id="memory-info">
    <span>Paires : <strong id="m-pairs">0 / 8</strong></span>
    <span>Coups : <strong id="m-moves">0</strong></span>
  </div>
  <div id="memory-grid"></div>
  <div id="memory-end" style="display:none;text-align:center;margin-top:1rem">
    <p style="font-size:1.2rem;font-weight:600;margin-bottom:.8rem" id="memory-end-msg"></p>
    <button class="btn btn-accent" onclick="memoryInit()">Rejouer</button>
  </div>
</div>
<script src="../js/shared.js"></script>
<script src="../js/memory.js"></script>
</body>
</html>
