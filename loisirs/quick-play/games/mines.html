<!DOCTYPE html>
<html lang="fr" data-cat="loisirs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUICKPLAY  -  Démineur</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../../assets/theme.css" />
<script src="../../../assets/site.js" defer></script>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/mines.css">
</head>
<body>
<div id="stars"></div>
<div id="game-mines" class="screen active">
  <button class="btn-back" onclick="backToHub()">← Retour</button>
  <h2 class="game-title">💣 Démineur</h2>
  <div id="mines-stats">
    <div class="stat"><div class="stat-val" id="mines-flags">0 / 10</div><div class="stat-lbl">Drapeaux</div></div>
    <div class="stat"><div class="stat-val" id="mines-timer">0</div><div class="stat-lbl">Secondes</div></div>
  </div>
  <p style="color:var(--muted);font-size:.8rem;margin-bottom:.4rem">Clic droit ou appui long = drapeau </p>
  <div id="mines-board"></div>
  <div id="mines-msg"></div>
  <button class="btn btn-accent" id="mines-restart" style="display:none;margin-top:.5rem" onclick="minesInit()">Rejouer</button>
</div>
<script src="../js/shared.js"></script>
<script src="../js/mines.js"></script>
</body>
</html>
