<!doctype html>
<html class="sim" lang="fr" data-cat="loisirs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rail Express</title>
<meta name="description" content="Simulateur de conduite ferroviaire : composez votre train, choisissez votre itinéraire en France et conduisez avec une vraie signalisation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/simulateur.css" />
<script src="../../assets/site.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════ CONFIGURATION ═══════════ -->
<section id="setup">
  <header class="su-head">
    <div class="su-brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="5" width="30" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><rect x="14" y="11" width="20" height="10" rx="2" fill="currentColor" opacity=".35"/><circle cx="17" cy="28" r="2.5" fill="currentColor"/><circle cx="31" cy="28" r="2.5" fill="currentColor"/><path d="M13 35l-5 9M35 35l5 9M10 41h28" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <div><h1>Rail Express</h1><p>Composez votre train, tracez votre ligne, prenez le service.</p></div>
    </div>
    <ol class="su-steps" id="suSteps">
      <li data-step="0">Voyage</li><li data-step="1">Engin moteur</li><li data-step="2">Composition</li><li data-step="3">Itinéraire</li><li data-step="4">Départ</li>
    </ol>
  </header>
  <main class="su-body" id="suBody"></main>
  <footer class="su-foot">
    <button class="btn ghost" id="suPrev">← Retour</button>
    <div class="su-summary" id="suSummary"></div>
    <button class="btn primary" id="suNext">Suivant →</button>
  </footer>
</section>

<!-- ═══════════ JEU ═══════════ -->
<section id="game" hidden>
  <div id="view"></div>
  <div id="hud"></div>
  <aside id="checklist"></aside>
  <div id="pupitre"></div>
  <div id="toasts"></div>
  <div id="loading" hidden><div class="ld-box"><div class="ld-bar"><i></i></div><p>Génération de la ligne…</p></div></div>
</section>

<div id="modal" hidden><div class="md-box" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/track.js"></script>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/models.js"></script>
<script src="js/world.js"></script>
<script src="js/cab.js"></script>
<script src="js/setup.js"></script>
<script src="js/main.js"></script>
</body>
</html>
